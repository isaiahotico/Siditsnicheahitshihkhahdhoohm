<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monetag Telegram Leaderboard Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
h2, h3 { text-align: center; }
#loginContainer { text-align:center; margin-bottom:20px; }
nav { text-align: center; margin-bottom: 20px; }
nav button { padding: 8px 16px; margin: 0 5px; background:#2196F3; color:white; border:none; border-radius:5px; cursor:pointer;}
nav button.active { background:#0b79d0; }
table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
th { background: #4CAF50; color: white; }
button { padding: 6px 12px; background: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #e68900; }
.reward-popup { position: absolute; font-weight: bold; color: #4CAF50; font-size: 18px; pointer-events: none; animation: pop 1s ease-out forwards; }
@keyframes pop { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-50px); } }
#wallet { font-size: 20px; text-align:center; margin-bottom:10px; }
#dailyBonus { text-align:center; margin-bottom:20px; }
#leaderboard { margin-top:20px; }
</style>
</head>
<body>

<h2>Monetag Telegram Leaderboard Dashboard</h2>

<div id="loginContainer">
    <script async src="https://telegram.org/js/telegram-widget.js?7"
        data-telegram-login="YourBotUsername"
        data-size="large"
        data-userpic="false"
        data-request-access="write"
        data-onauth="onTelegramAuth(user)">
    </script>
</div>

<div id="userContainer" style="display:none;">
    <div id="wallet">Wallet: <span id="walletBalance">0</span> points</div>
    <div id="dailyBonus"><button id="dailySignIn">Daily Sign-In Bonus</button></div>

    <nav id="roomNav">
        <button class="active" data-room="1">Room 1</button>
        <button data-room="2">Room 2</button>
    </nav>

    <h3>Top Global CPM: $<span id="topCPM">0.00</span></h3>

    <table id="adTable">
        <thead>
            <tr>
                <th>Ad Type</th>
                <th>Zone ID</th>
                <th>CPM (USD)</th>
                <th>Status</th>
                <th>Reward</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adTableBody"></tbody>
    </table>

    <h3>Leaderboard</h3>
    <table id="leaderboard">
        <thead>
            <tr>
                <th>Telegram Username</th>
                <th>Total Rewards</th>
                <th>Top CPM</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
    </table>
</div>

<script src="//libtl.com/sdk.js" data-zone="10337795" data-sdk="show_10337795"></script>
<script>
// === CONFIG ===
const adRooms = {
    1: [
        { type: 'Rewarded Interstitial', zone: '10337795', reward: 50 },
        { type: 'Rewarded Popup', zone: '10337795', reward: 30 }
    ],
    2: [
        { type: 'In-App Interstitial', zone: '10337795', reward: 20, settings: { frequency:2, capping:0.1, interval:30, timeout:5 } },
        { type: 'Rewarded Interstitial', zone: '10337795', reward: 40 }
    ]
};

// === GLOBALS ===
let wallet = 0;
let lastSignIn = null;
let username = null;
const tableBody = document.getElementById('adTableBody');
const walletEl = document.getElementById('walletBalance');
const topCPMEl = document.getElementById('topCPM');
const roomNav = document.getElementById('roomNav');
const dailyBtn = document.getElementById('dailySignIn');
const leaderboardBody = document.getElementById('leaderboardBody');
const userContainer = document.getElementById('userContainer');

// === TELEGRAM AUTH ===
function onTelegramAuth(user) {
    username = user.username;
    console.log('Logged in as:', username);
    userContainer.style.display = 'block';
    document.getElementById('loginContainer').style.display = 'none';

    // Load user data from localStorage
    const data = JSON.parse(localStorage.getItem('user_'+username)) || { wallet:0, lastSignIn:null, topCPM:0 };
    wallet = data.wallet;
    lastSignIn = data.lastSignIn;
    walletEl.innerText = wallet;

    loadRoom(1);
    updateLeaderboard();
}

// === UTILITIES ===
function showRewardPopup(text, row) {
    const popup = document.createElement('div');
    popup.className = 'reward-popup';
    popup.innerText = text;
    const rect = row.getBoundingClientRect();
    popup.style.left = rect.left + window.scrollX + rect.width/2 + 'px';
    popup.style.top = rect.top + window.scrollY - 20 + 'px';
    document.body.appendChild(popup);
    setTimeout(() => document.body.removeChild(popup), 1000);
}

function saveUserData(cpm = 0) {
    const data = JSON.parse(localStorage.getItem('user_'+username)) || { wallet:0, lastSignIn:null, topCPM:0 };
    data.wallet = wallet;
    data.topCPM = Math.max(cpm, data.topCPM || 0);
    data.lastSignIn = lastSignIn;
    localStorage.setItem('user_'+username, JSON.stringify(data));
    updateLeaderboard();
}

function updateLeaderboard() {
    leaderboardBody.innerHTML = '';
    for(let key in localStorage) {
        if(key.startsWith('user_')) {
            const u = JSON.parse(localStorage.getItem(key));
            const row = document.createElement('tr');
            row.innerHTML = `<td>@${key.replace('user_','')}</td><td>${u.wallet}</td><td>$${u.topCPM.toFixed(2)}</td>`;
            leaderboardBody.appendChild(row);
        }
    }
}

// === LOAD ROOM ===
function loadRoom(roomId) {
    tableBody.innerHTML = '';
    adRooms[roomId].forEach(ad => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${ad.type}</td>
            <td>${ad.zone}</td>
            <td>$0.00</td>
            <td>Pending</td>
            <td>0</td>
            <td><button>Show Ad</button></td>
        `;
        const btn = row.querySelector('button');
        btn.addEventListener('click', () => showAd(ad, row));
        tableBody.appendChild(row);
    });
}

// === SHOW AD ===
function showAd(ad, row) {
    let showFn = typeof show_10337795 === 'function' ? show_10337795 : () => Promise.reject('SDK not loaded');
    const handleSuccess = () => {
        const newCPM = parseFloat((Math.random()*0.5 + 0.1).toFixed(2));
        row.cells[2].innerText = `$${newCPM}`;
        row.cells[3].innerText = '✅ Played';
        row.cells[4].innerText = `+${ad.reward}`;
        wallet += ad.reward;
        walletEl.innerText = wallet;
        saveUserData(newCPM);
        showRewardPopup(`+${ad.reward} points`, row);
        updateTopCPM();
    };
    const handleError = () => row.cells[3].innerText = '❌ Error';

    if(ad.type === 'Rewarded Interstitial') showFn().then(handleSuccess).catch(handleError);
    else if(ad.type === 'Rewarded Popup') showFn('pop').then(handleSuccess).catch(handleError);
    else if(ad.type === 'In-App Interstitial') showFn({ type:'inApp', inAppSettings: ad.settings }).then(handleSuccess).catch(handleError);
}

// === DAILY SIGN-IN ===
dailyBtn.addEventListener('click', () => {
    const today = new Date().toDateString();
    if(lastSignIn !== today) {
        const bonus = 100;
        wallet += bonus;
        walletEl.innerText = wallet;
        lastSignIn = today;
        alert(`Daily sign-in successful! +${bonus} points`);
        saveUserData();
    } else {
        alert('You already claimed your daily bonus today!');
    }
});

// === ROOM NAVIGATION ===
roomNav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
        roomNav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        loadRoom(btn.dataset.room);
    });
});

// === LIVE CPM UPDATE EVERY 5 SECONDS ===
setInterval(() => {
    if(username) {
        Array.from(tableBody.rows).forEach(row => {
            if(row.cells[3].innerText === '✅ Played') {
                const newCPM = parseFloat((Math.random()*0.5 + 0.1).toFixed(2));
                row.cells[2].innerText = `$${newCPM}`;
                saveUserData(newCPM);
            }
        });
        updateTopCPM();
    }
}, 5000);

// === TOP CPM ===
function updateTopCPM() {
    let maxCPM = 0;
    Array.from(tableBody.rows).forEach(row => {
        const cpm = parseFloat(row.cells[2].innerText.replace('$','')) || 0;
        if(cpm > maxCPM) maxCPM = cpm;
    });
    topCPMEl.innerText = maxCPM.toFixed(2);
}
</script>

</body>
</html>
