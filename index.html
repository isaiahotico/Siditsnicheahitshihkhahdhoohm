<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreeGcashAds - Gold Armor</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram Script -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --gold: #f5d76e;
            --dark-gold: #b8860b;
            --armor-plate: linear-gradient(145deg, #dfbc4d, #f9ea8d, #b88a1a);
            --shine-anim: shine 3s infinite;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            background-image: radial-gradient(circle at center, #2c2102 0%, #000 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .armor-header {
            width: 100%;
            height: 180px;
            background: var(--armor-plate);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid var(--dark-gold);
            box-shadow: 0 5px 20px rgba(218, 165, 32, 0.4);
            position: relative;
        }

        .armor-header h1 {
            font-size: 2rem;
            margin: 0;
            color: #332100;
            text-shadow: 1px 1px 0px #fff;
            letter-spacing: 2px;
        }

        .balance-container {
            margin-top: -30px;
            background: #1a1a1a;
            padding: 20px 40px;
            border-radius: 50px;
            border: 2px solid var(--dark-gold);
            box-shadow: 0 0 15px var(--dark-gold);
            text-align: center;
            z-index: 10;
        }

        .balance-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 215, 110, 0.5);
        }

        .ad-container {
            width: 90%;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-gold {
            background: var(--armor-plate);
            border: 1px solid #7a5d0f;

            padding: 18px;
            border-radius: 12px;
            color: #332100;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-gold:active { transform: scale(0.95); }

        /* Shining Animation */
        .btn-gold::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-150%) rotate(45deg); }
            100% { transform: translateX(150%) rotate(45deg); }
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--gold);
            text-align: center;
        }

        .footer {
            margin-top: auto;
            padding: 20px;
            font-size: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="armor-header">
        <h1>FREEGCASH</h1>
        <p style="color: #4a3701; font-weight: bold;">Adsgram Gold Edition</p>
    </div>

    <div class="balance-container">
        <div style="font-size: 0.8rem; color: #888;">CURRENT POINTS</div>
        <div class="balance-value" id="balance">0</div>
    </div>

    <div class="ad-container">
        <button class="btn-gold" id="btn-reward-1">✨ Watch Golden Ad (+10)</button>
        <button class="btn-gold" id="btn-reward-2">🛡️ Armor Bonus (+10)</button>
        <button class="btn-gold" id="btn-interstitial">💰 Instant Reward (+5)</button>
    </div>

    <div id="status-msg">Welcome, Warrior.</div>

    <div class="footer">Adsgram ID Verification Active</div>

    <!-- Firebase App Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
