
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>

    <style>
        :root {
            --charcoal: #36454f;
            --gold-armor: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --lagoon: linear-gradient(180deg, #00B4DB 0%, #0083B0 100%);
        }
        body { color: var(--charcoal); font-weight: 900; overflow: hidden; height: 100vh; font-family: sans-serif; }
        #bg-layer { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; transition: 0.8s ease; }
        .gold-armor { background: var(--gold-armor); background-size: 400% 400%; animation: shine 3s infinite; }
        .lagoon-bg { background: var(--lagoon); }
        @keyframes shine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); border: 2px solid rgba(255,255,255,0.4); border-radius: 20px; }
        .tab-content { display: none; height: 75vh; overflow-y: auto; padding: 10px; }
        .active-tab { display: block; }
        .thick-text { -webkit-text-stroke: 0.5px #36454f; }
    </style>
</head>
<body>

    <div id="bg-layer" class="gold-armor"></div>

    <!-- Login -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl mb-4 thick-text">🎖 PAPERHOUSE INC ADS 🎖</h1>
        <p class="mb-6 opacity-70">The World's Best Rewards App</p>
        <input type="text" id="username" placeholder="Enter Nickname" class="w-full p-4 glass border-2 border-[#36454f] mb-4 text-center">
        <button onclick="app.login()" class="w-full bg-[#36454f] text-white p-4 rounded-xl text-xl shadow-lg">START EARNING</button>
    </div>

    <!-- Profile Modal -->

    <div id="profile-modal" class="fixed inset-0 z-[60] bg-black/80 hidden flex items-center justify-center p-4">
        <div class="glass bg-white w-full max-w-sm p-6 text-center relative">
            <button onclick="app.closeProfile()" class="absolute top-4 right-4 text-2xl">&times;</button>
            <i class="fas fa-user-circle text-6xl mb-2"></i>
            <h2 id="p-name" class="text-2xl mb-4">Username</h2>
            <div class="grid grid-cols-2 gap-2 text-sm mb-6">
                <div class="p-2 bg-white/30 rounded">Ads Watched:<br><span id="p-ads">0</span></div>
                <div class="p-2 bg-white/30 rounded">Total Earned:<br>₱<span id="p-total">0</span></div>
                <div class="p-2 bg-white/30 rounded col-span-2">Current Balance:<br>₱<span id="p-bal">0</span></div>
            </div>
            <button id="p-msg-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold mb-2">Message User</button>
        </div>
    </div>

    <!-- Main UI -->
    <div id="main-ui" class="hidden h-screen flex flex-col">
        <header class="p-4 flex justify-between items-center glass m-2">
            <div onclick="app.openMyProfile()" class="cursor-pointer">
                <p class="text-[10px] uppercase">Welcome</p>
                <p class="text-lg font-black underline"><span id="user-display">User</span></p>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase">Current Balance</p>
                <p class="text-xl font-black text-[#36454f]">₱<span id="balance">0.0000</span></p>
            </div>
        </header>

        <main class="flex-1">
            <!-- Ads Tab -->
            <div id="tab-home" class="tab-content active-tab text-center">
                <div class="mt-12">
                    <button onclick="app.watchMainAd()" class="w-60 h-60 rounded-full glass border-4 border-[#36454f] shadow-2xl relative group active:scale-95 transition">
                        <div class="absolute inset-0 bg-yellow-400/20 rounded-full animate-pulse"></div>
                        <i class="fas fa-play text-7xl mb-2"></i><br>
                        <span class="text-xl">WATCH AD</span><br>
                        <span class="text-xs">₱0.0065 Reward</span>
                    </button>
                </div>
            </div>

            <!-- Chat Tab -->
            <div id="tab-chat" class="tab-content">
                <div class="h-full flex flex-col glass p-2">
                    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 p-2"></div>
                    <div class="flex gap-2 p-2 bg-white/20 rounded-xl mt-2">
                        <input type="text" id="chat-input" class="flex-1 bg-transparent outline-none p-2" placeholder="Talk to everyone...">
                        <button onclick="app.sendMessage()" class="bg-[#36454f] text-white px-4 py-2 rounded-lg">Send</button>
                    </div>
                </div>
            </div>

            <!-- Leaderboard Tab -->
            <div id="tab-rank" class="tab-content">
                <h2 class="text-center text-xl mb-4 thick-text">🏆 GLOBAL LEADERS</h2>
                <div id="leaderboard" class="space-y-2"></div>
            </div>

            <!-- Wallet Tab -->
            <div id="tab-wallet" class="tab-content">
                <div class="glass p-4 mb-4">
                    <h3 class="mb-4 text-center">GCASH WITHDRAWAL</h3>
                    <input type="number" id="gcash-num" placeholder="GCash Mobile Number" class="w-full p-3 mb-2 rounded-lg border border-[#36454f]">

<input type="number" id="withdraw-amount" placeholder="Amount (Min 0.02)" class="w-full p-3 mb-4 rounded-lg border border-[#36454f]">
                    <button onclick="app.requestWithdraw()" class="w-full bg-green-700 text-white py-3 rounded-lg">WITHDRAW NOW</button>
                </div>
                <p class="text-xs uppercase mb-2 ml-2">Recent Transactions</p>
                <div id="history-list" class="space-y-2"></div>
            </div>

            <!-- Admin Tab -->
            <div id="tab-admin" class="tab-content">
                <div id="admin-lock" class="mt-10 p-4 glass">
                    <input type="password" id="admin-pass" placeholder="Admin Password" class="w-full p-3 mb-4 rounded border border-red-500">
                    <button onclick="app.unlockAdmin()" class="w-full bg-red-600 text-white py-3 rounded">LOGIN ADMIN</button>
                </div>
                <div id="admin-panel" class="hidden space-y-2">
                    <h2 class="text-center font-bold">PAYMENT REQUESTS</h2>
                    <div id="admin-list"></div>
                </div>
            </div>
        </main>

        <nav class="flex justify-around items-center p-4 glass m-2">
            <button onclick="app.switchTab('home')" class="text-2xl hover:scale-110"><i class="fas fa-tv">"tab-home"</i></button>
            <button onclick="app.switchTab('chat')" class="text-2xl hover:scale-110"><i class="fas fa-comment-dots">tab-chat</i></button>
            <button onclick="app.switchTab('rank')" class="text-2xl hover:scale-110"><i class="fas fa-medal">tab-rank</i></button>
            <button onclick="app.switchTab('wallet')" class="text-2xl hover:scale-110"><i class="fas fa-wallet">"tab-wallet"</i></button>
            <button onclick="app.switchTab('admin')" class="opacity-20 text-xs"><i class="fas fa-lock"></i>'tab-admin'</button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
