<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar { transition: 0.3s; transform: translateX(-100%); }
        .sidebar.active { transform: translateX(0); }
        .btn-primary { background: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%); }
        .reward-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black opacity-50 hidden z-40" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 glass z-50 sidebar p-5">
        <h2 class="text-xl font-bold mb-8 text-cyan-400">MENU</h2>
        <nav class="space-y-4">
            <button onclick="showPage('home')" class="block w-full text-left p-3 hover:bg-white/10 rounded">🏠 Dashboard</button>
            <button onclick="showPage('leaderboard')" class="block w-full text-left p-3 hover:bg-white/10 rounded">🏆 Leaderboard</button>
            <button onclick="showPage('chat')" class="block w-full text-left p-3 hover:bg-white/10 rounded">💬 Global Chat</button>
            <button onclick="showPage('withdraw')" class="block w-full text-left p-3 hover:bg-white/10 rounded">💸 Withdraw</button>
            <hr class="border-white/10">
            <button onclick="showPage('admin-login')" class="block w-full text-left p-3 hover:bg-white/10 rounded text-red-400">🛡 Admin Panel</button>
        </nav>
    </div>

    <!-- Top Bar -->
    <div class="p-4 glass flex justify-between items-center sticky top-0 z-30">
        <button onclick="toggleSidebar()" class="text-2xl">☰</button>

        <h1 class="font-bold text-sm text-cyan-400">🎖 PAPERHOUSE INC 🎖</h1>
        <div class="text-right">
            <p class="text-[10px] text-gray-400">Balance</p>
            <p class="text-green-400 font-bold">₱<span id="user-balance">0.00</span></p>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="p-4 pb-20">
        
        <!-- HOME PAGE -->
        <section id="page-home" class="page-section">
            <div class="glass p-6 rounded-2xl text-center mb-6 mt-4">
                <h2 class="text-2xl font-black mb-2">EARN REWARDS</h2>
                <p class="text-gray-400 text-sm mb-6">Watch ads to earn ₱0.01 per view!</p>
                <button onclick="watchAd()" class="btn-primary w-full py-4 rounded-xl font-bold text-lg shadow-lg reward-pulse">
                    WATCH VIDEO AD 📺
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-xl text-center">
                    <p class="text-xs text-gray-400 uppercase">Min. Withdraw</p>
                    <p class="font-bold">₱0.02</p>
                </div>
                <div class="glass p-4 rounded-xl text-center">
                    <p class="text-xs text-gray-400 uppercase">Ads Watched</p>
                    <p id="total-watched" class="font-bold">0</p>
                </div>
            </div>
        </section>

        <!-- LEADERBOARD PAGE -->
        <section id="page-leaderboard" class="page-section hidden">
            <h2 class="text-xl font-bold mb-4 text-center">🏆 Top Earners</h2>
            <div id="leaderboard-list" class="space-y-2">
                <!-- Data injected here -->
            </div>
        </section>

        <!-- CHAT PAGE -->
        <section id="page-chat" class="page-section hidden h-[70vh] flex flex-col">
            <div id="chat-box" class="flex-1 glass p-4 rounded-t-xl overflow-y-auto space-y-3 mb-2">
                <!-- Messages injected here -->
            </div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" class="flex-1 bg-white/10 border-none rounded-lg p-3 text-white focus:ring-2 ring-cyan-500" placeholder="Type message...">
                <button onclick="sendMessage()" class="bg-cyan-600 px-4 rounded-lg">Send</button>
            </div>
        </section>

        <!-- WITHDRAW PAGE -->
        <section id="page-withdraw" class="page-section hidden text-center">
            <div class="glass p-6 rounded-2xl">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/GCash_logo.svg/1200px-GCash_logo.svg.png" class="h-8 mx-auto mb-4" alt="GCash">
                <h2 class="text-xl font-bold mb-4">Withdraw to GCash</h2>
                <input type="text" id="gcash-number" class="w-full bg-white/10 p-3 rounded-lg mb-4 text-center" placeholder="GCash Number (09...)">
                <p class="text-sm text-gray-400 mb-4">Minimum withdrawal amount is ₱0.02</p>
                <button onclick="requestWithdraw()" class="w-full bg-green-600 py-3 rounded-xl font-bold">REQUEST CASH OUT</button>
            </div>
        </section>

        <!-- ADMIN LOGIN PAGE -->
        <section id="page-admin-login" class="page-section hidden">
            <div class="glass p-6 rounded-2xl max-w-sm mx-auto">
                <h2 class="text-xl font-bold mb-4">Admin Access</h2>
                <input type="password" id="admin-pass" class="w-full bg-white/10 p-3 rounded-lg mb-4" placeholder="Enter Password">
                <button onclick="checkAdmin()" class="w-full bg-red-600 py-3 rounded-xl font-bold">LOGIN</button>
            </div>
        </section>

        <!-- ADMIN DASHBOARD -->
        <section id="page-admin-dashboard" class="page-section hidden">
            <h2 class="text-xl font-bold mb-4">Withdrawal Requests</h2>
            <div id="admin-requests" class="space-y-2"></div>
        </section>

    </main>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
