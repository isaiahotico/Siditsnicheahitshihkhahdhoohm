<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram RichAds App</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- RichAds Telegram SDK -->
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
  text-align: center;
}

h2 {
  margin-top: 16px;
}

#username {
  margin: 10px;
  font-size: 15px;
  color: #38bdf8;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 20px;
}

button {
  padding: 15px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg,#22c55e,#06b6d4);
  color: #fff;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}
</style>
</head>

<body>

<h2>💎 Watch Ads & Earn</h2>
<div id="username">Loading Telegram user...</div>

<div class="buttons">
  <button onclick="showAd()">Ad Button 1</button>
  <button onclick="showAd()">Ad Button 2</button>
  <button onclick="showAd()">Ad Button 3</button>
  <button onclick="showAd()">Ad Button 4</button>
</div>

<script src="app.js"></script>
</body>
</html>
