<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adsgram + Backup Ad (Telegram)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/adsgram.js"></script>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#0f2027;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      color:#fff;
      text-align:center;
      padding:20px;
    }
    .card{
      background:rgba(255,255,255,0.1);
      border-radius:12px;
      padding:20px;
      margin:15px auto;
      max-width:420px;
    }
    button{
      background:#00e0ff;
      color:#000;
      border:none;
      padding:14px 20px;
      font-size:16px;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      font-weight:bold;
    }
    button:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }
    #timerBox{display:none;margin-top:10px;font-size:18px;}
    #status{margin-top:10px;font-size:14px;}
    .username{font-weight:bold;color:#00ffae;}
  </style>
</head>
<body>

  <div class="card">
    <h3>👤 Telegram User</h3>
    <div id="userBox">Loading…</div>
  </div>

  <div class="card">
    <button id="adsBtn" onclick="startAdFlow()">▶ Watch Ad & Earn</button>
    <div id="timerBox">⏱ Time left: <span id="timer">30</span>s</div>
    <div id="status"></div>
  </div>

<script>
/******** TELEGRAM USER DISPLAY ********/
let tg = window.Telegram.WebApp;
tg.ready();

const userBox = document.getElementById('userBox');
if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  const u = tg.initDataUnsafe.user;
  const name = u.username ? '@' + u.username : (u.first_name || 'Unknown');
  userBox.innerHTML = 'Hello <span class="username">' + name + '</span>';
} else {
  userBox.innerHTML = 'Not opened inside Telegram';
}

/******** ADS + BACKUP LOGIC ********/
let timeLeft = 30;
let timerInt = null;
let focused = true;
let adDone = false;

// pause timer on tab switch
 document.addEventListener('visibilitychange',()=>{
   focused = !document.hidden;
 });

function startAdFlow(){
  const btn = document.getElementById('adsBtn');
  const timerBox = document.getElementById('timerBox');
  const timerTxt = document.getElementById('timer');
  const status = document.getElementById('status');

  btn.disabled = true;
  adDone = false;
  timeLeft = 30;
  timerTxt.innerText = timeLeft;
  timerBox.style.display = 'block';
  status.innerHTML = 'Loading ad…';

  // Try Adsgram first
  try {
    Adsgram.show({ blockId:'task-21469' })
      .then(()=>{
        adDone = true;
        status.innerHTML = '✅ Ad completed, finish timer…';
      })
      .catch(()=>{
        showBackupAd();
      });
  } catch(e){
    showBackupAd();
  }

  timerInt = setInterval(()=>{
    if(!focused) return;
    timeLeft--;
    timerTxt.innerText = timeLeft;

    if(timeLeft <= 0){
      clearInterval(timerInt);
      if(adDone){
        reward();
      } else {
        reset('❌ Ad not completed');
      }
    }
  },1000);
}

/******** BACKUP AD (DIRECT LINK) ********/
function showBackupAd(){
  document.getElementById('status').innerHTML = '⚠ Adsgram unavailable. Backup ad opened.';
  window.open('https://www.effectivegatecpm.com','_blank');
  adDone = true; // treat backup as valid
}

/******** REWARD ********/
function reward(){
  let bal = parseFloat(localStorage.getItem('balance') || 0);
  bal += 0.0095;
  localStorage.setItem('balance', bal.toFixed(4));

  document.getElementById('status').innerHTML =
    '🎉 Reward credited<br>💰 Balance: ' + bal.toFixed(4);
  document.getElementById('adsBtn').disabled = false;
}

function reset(msg){
  clearInterval(timerInt);
  document.getElementById('status').innerHTML = msg;
  document.getElementById('timerBox').style.display = 'none';
  document.getElementById('adsBtn').disabled = false;
}
</script>

</body>
</html>
