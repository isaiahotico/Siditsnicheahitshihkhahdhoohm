<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    
    <style>
        :root { --primary: #f1c40f; --secondary: #2ecc71; --bg: #0b0e11; --card: #161a1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        .header { background: #1c2127; padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 100; }
        .balance-box { background: linear-gradient(135deg, #1e262f, #111); margin: 15px; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #333; }
        .balance-box h1 { color: var(--secondary); font-size: 2.5rem; margin: 10px 0; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #1c2127; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { color: #888; font-size: 0.7rem; text-align: center; cursor: pointer; border: none; background: none; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 2px; }

        .page { display: none; padding: 15px; padding-bottom: 100px; }
        .page.active { display: block; }

        .btn { background: var(--secondary); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #1c2127; color: #fff; box-sizing: border-box; }

        .chat-area { height: 250px; background: #000; overflow-y: auto; border-radius: 10px; padding: 10px; border: 1px solid #333; display: flex; flex-direction: column-reverse; }
        .msg { margin-bottom: 5px; font-size: 0.9rem; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .msg b { color: var(--primary); }        .history-item { background: #1c2127; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #444; }
        .status-pending { border-left-color: #f1c40f; }
        .status-approved { border-left-color: #2ecc71; }

        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; padding: 15px; overflow-y: auto; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header">
        <div id="username-display" style="font-weight: bold; color: var(--primary);">Loading...</div>
    </div>

    <!-- Home -->
    <section id="home" class="page active">
        <div class="balance-box">
            <p style="margin:0; opacity:0.7;">TOTAL PESO</p>
            <h1 id="user-balance">₱0.0000</h1>
            <button id="ad-btn" class="btn" onclick="handleAdClick()">
                <i class="fas fa-play"></i> WATCH AD (₱0.01)
            </button>
            <p id="cooldown-timer" style="font-size: 0.8rem; margin-top: 10px; color: #f1c40f;"></p>
        </div>
    </section>

    <!-- Wallet -->
    <section id="wallet" class="page">
        <h3>Withdrawal</h3>
        <select id="w-method">
            <option value="GCash">GCash</option>
            <option value="PayPal">PayPal</option>
            <option value="FaucetPay">FaucetPay</option>
        </select>
        <input type="text" id="w-account" placeholder="Enter Wallet Info">
        <button class="btn" style="background:var(--primary); color:black;" onclick="requestPayout()">SUBMIT REQUEST</button>
        
        <h4 style="margin-top:20px;">My Payout History</h4>
        <div id="payout-history"></div>
    </section>

    <!-- Chat -->
    <section id="chat" class="page">
        <h3>Global Group</h3>
        <div id="chat-box" class="chat-area"></div>
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="text" id="chat-msg" placeholder="Type a message...">
            <button class="btn" style="width: 80px;" onclick="sendChat()">Send</button>
        </div>
    </section>

    <!-- Leaderboard -->
    <section id="leaderboard" class="page">
        <h3>Top Earners</h3>
        <div id="leader-list"></div>
    </section>

    <!-- Admin Dash -->
    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between;">
            <h2>Admin Requests</h2>
            <button onclick="closeAdmin()" style="background:red; border:none; color:white; padding:5px 10px; border-radius:5px;">X</button>
        </div>
        <div id="admin-list"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="tab('home', this)"><i class="fas fa-home"></i>Earn</div>
        <div class="nav-item" onclick="tab('wallet', this)"><i class="fas fa-wallet"></i>Wallet</div>
        <div class="nav-item" onclick="tab('chat', this)"><i class="fas fa-comments"></i>Chat</div>
        <div class="nav-item" onclick="tab('leaderboard', this)"><i class="fas fa-trophy"></i>Top</div>
        <div class="nav-item" onclick="openAdmin()"><i class="fas fa-lock"></i>Admin</div>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
