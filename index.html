<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram Monetag Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag SDK (NO async / defer) -->
<script src="https://libtl.com/sdk.js"
        data-zone="10337795"
        data-sdk="show_10337795"></script>

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  background:#0e1220;
  font-family:Arial, sans-serif;
  display:flex;
  flex-direction:column;
  gap:14px;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.btn{
  width:240px;
  height:68px;
  border:none;
  border-radius:16px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
}
.btn:disabled{background:#444;cursor:not-allowed;}
.blue{background:linear-gradient(135deg,#4facfe,#00f2fe);}
.green{background:linear-gradient(135deg,#43e97b,#38f9d7);}
.orange{background:linear-gradient(135deg,#ff9800,#ff5722);}
.purple{background:linear-gradient(135deg,#a18cd1,#fbc2eb);}
.time{font-size:12px;opacity:.9;margin-top:4px;}
</style>
</head>

<body>

<button id="daily" class="btn blue">
🎁 Daily Login
<div class="time" id="t_daily">Ready</div>
</button>

<button id="gift" class="btn green">
🎁 Gift
<div class="time" id="t_gift">Ready</div>
</button>

<button id="inapp" class="btn orange">
📺 In-App Interstitial
<div class="time" id="t_inapp">Ready</div>
</button>

<button id="popup" class="btn purple">
🎉 Rewarded Popup
<div class="time" id="t_popup">Ready</div>
</button>

<script>
// Telegram expand
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// Cooldowns
const CD = {
  daily: 15 * 60 * 1000,
  gift: 15 * 60 * 1000,
  inapp: 5 * 60 * 1000,
  popup: 5 * 60 * 1000
};

function monetagReady(){
  return typeof window.show_10337795 === "function";
}

function update(btn, label, key, ms){
  const last = localStorage.getItem(key);
  if(!last){ btn.disabled=false; label.textContent="Ready"; return; }
  const d = Date.now() - last;
  if(d >= ms){
    btn.disabled=false;
    label.textContent="Ready";
  }else{
    btn.disabled=true;
    const r = ms - d;
    const m = Math.floor(r/60000);
    const s = Math.floor((r%60000)/1000);
    label.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }
}

setInterval(()=>{
  update(daily,t_daily,"cd_daily",CD.daily);
  update(gift,t_gift,"cd_gift",CD.gift);
  update(inapp,t_inapp,"cd_inapp",CD.inapp);
  update(popup,t_popup,"cd_popup",CD.popup);
},1000);

// BACKUP AD CHAIN (BEST PRACTICE)
async function showWithBackup(reward){
  try{
    await show_10337795(); // Rewarded Interstitial
    if(reward) Telegram.WebApp.showAlert("✅ Reward granted");
    return true;
  }catch{
    try{
      await show_10337795('pop'); // Rewarded Popup
      if(reward) Telegram.WebApp.showAlert("🎁 Popup reward");
      return true;
    }catch{
      try{
        show_10337795({
          type:'inApp',
          inAppSettings:{
            frequency:1,
            capping:1,
            interval:30,
            timeout:5,
            everyPage:false
          }
        });
        return true;
      }catch{
        Telegram.WebApp.showAlert("❌ No ad available");
        return false;
      }
    }
  }
}

// BUTTONS
daily.onclick = async ()=>{
  if(!monetagReady()) return Telegram.WebApp.showAlert("SDK not ready");
  daily.disabled=true; t_daily.textContent="Loading...";
  if(await showWithBackup(true))
    localStorage.setItem("cd_daily",Date.now());
};

gift.onclick = async ()=>{
  if(!monetagReady()) return Telegram.WebApp.showAlert("SDK not ready");
  gift.disabled=true; t_gift.textContent="Loading...";
  if(await showWithBackup(true))
    localStorage.setItem("cd_gift",Date.now());
};

inapp.onclick = ()=>{
  if(!monetagReady()) return Telegram.WebApp.showAlert("SDK not ready");
  inapp.disabled=true; t_inapp.textContent="Showing...";
  show_10337795({
    type:'inApp',
    inAppSettings:{
      frequency:2,
      capping:0.1,
      interval:30,
      timeout:5,
      everyPage:false
    }
  });
  localStorage.setItem("cd_inapp",Date.now());
};

popup.onclick = async ()=>{
  if(!monetagReady()) return Telegram.WebApp.showAlert("SDK not ready");
  popup.disabled=true; t_popup.textContent="Loading...";
  try{
    await show_10337795('pop');
    Telegram.WebApp.showAlert("🎉 Popup reward");
    localStorage.setItem("cd_popup",Date.now());
  }catch{
    show_10337795({
      type:'inApp',
      inAppSettings:{frequency:1,capping:1,interval:30,timeout:5,everyPage:false}
    });
    localStorage.setItem("cd_popup",Date.now());
  }
};
</script>

</body>
</html>
