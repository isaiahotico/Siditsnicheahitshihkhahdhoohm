
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Ads SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        .active-tab { border-bottom: 4px solid #3b82f6; color: #3b82f6; }
        #timer-overlay { display: none; background: rgba(0,0,0,0.9); z-index: 9999; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-gray-800 p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-blue-400">PAPERHOUSE INC</h1>
            <p id="displayUsername" class="text-xs text-gray-400">@Guest</p>
        </div>
        <div class="text-right">
            <p class="text-sm text-gray-400">Balance</p>
            <p class="text-xl font-bold text-green-400">₱<span id="balance">0.00</span></p>
        </div>
    </header>

    <!-- Referral & Admin Section -->
    <section class="p-4 bg-gray-800 m-4 rounded-xl">
        <div class="flex justify-between items-center mb-2">
            <h2 class="font-bold">Referral (20% Commission)</h2>
            <button onclick="showAdminPrompt()" class="text-[10px] text-gray-600">Admin</button>
        </div>
        <div class="flex gap-2">
            <input id="referralInput" type="text" placeholder="Paste 12-char code" class="bg-gray-700 p-2 rounded flex-1 text-sm border border-gray-600">
            <button onclick="applyReferral()" class="bg-blue-600 px-4 py-2 rounded text-sm">Apply</button>
        </div>
        <div class="mt-2 text-xs text-gray-400 flex justify-between">
            <span>Your Code: <b id="myReferralCode" class="text-blue-300">...</b></span>
            <span>Earned: ₱<span id="refEarned">0.00</span> (<span id="refCount">0</span> users)</span>
        </div>
    </section>

    <!-- Category Toggles -->

    <nav class="flex overflow-x-auto whitespace-nowrap bg-gray-800 px-2 gap-4 border-b border-gray-700 no-scrollbar">
        <button onclick="switchTab('watch')" class="tab-btn py-3 px-2 active-tab" id="tab-watch">Watch</button>
        <button onclick="switchTab('sub')" class="tab-btn py-3 px-2" id="tab-sub">Sub</button>
        <button onclick="switchTab('like')" class="tab-btn py-3 px-2" id="tab-like">Like</button>
        <button onclick="switchTab('comment')" class="tab-btn py-3 px-2" id="tab-comment">Comment</button>
        <button onclick="switchTab('fb_follow')" class="tab-btn py-3 px-2" id="tab-fb_follow">FB Follow</button>
        <button onclick="switchTab('fb_like')" class="tab-btn py-3 px-2" id="tab-fb_like">FB Like</button>
        <button onclick="switchTab('site')" class="tab-btn py-3 px-2" id="tab-site">Visit</button>
        <button onclick="switchTab('playstore')" class="tab-btn py-3 px-2" id="tab-playstore">Apps</button>
    </nav>

    <!-- Content Area -->
    <main id="linkContainer" class="p-4 grid grid-cols-1 gap-4">
        <!-- Links will be injected here -->
    </main>

    <!-- Submission Floating Button -->
    <button onclick="toggleSubmitModal()" class="fixed bottom-24 right-4 bg-blue-500 w-14 h-14 rounded-full shadow-lg text-2xl font-bold z-40">+</button>

    <!-- Submit Modal -->
    <div id="submitModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 w-full max-w-md p-6 rounded-2xl">
            <h2 class="text-xl font-bold mb-4">Promote Your Link</h2>
            <select id="submitType" class="w-full bg-gray-700 p-3 rounded mb-3">
                <option value="watch">YouTube Watch (₱1.00 for 120)</option>
                <option value="sub">YouTube Sub (₱1.00 for 60)</option>
                <option value="like">YouTube Like (₱1.00 for 120)</option>
                <option value="comment">YouTube Comment (₱1.00 for 120)</option>
                <option value="fb_follow">FB Follow (₱1.00 for 120)</option>
                <option value="fb_like">FB Like (₱1.00 for 120)</option>
                <option value="site">Website Visit (₱1.00 for 120)</option>
                <option value="playstore">Playstore App (₱1.00 for 120)</option>
            </select>
            <input id="submitUrl" type="url" placeholder="Paste URL here..." class="w-full bg-gray-700 p-3 rounded mb-4">
            <div class="flex gap-2">
                <button onclick="processLinkSubmission()" class="flex-1 bg-green-600 py-3 rounded font-bold">Submit</button>
                <button onclick="toggleSubmitModal()" class="flex-1 bg-red-600 py-3 rounded">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Timer Overlay (Player Card) -->
    <div id="timer-overlay" class="fixed inset-0 flex flex-col items-center justify-center p-6 text-center">
        <div id="player-card" class="bg-gray-800 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl border border-gray-700">
            <div id="video-container" class="aspect-video bg-black w-full">
                <!-- Iframe injected here -->
            </div>
            <div class="p-6">
                <h3 class="text-xl font-bold mb-2">Complete the Task</h3>
                <p class="text-gray-400 text-sm mb-4" id="task-desc">Stay on this page to earn reward.</p>
                <div class="w-full bg-gray-700 h-4 rounded-full mb-2">
                    <div id="timer-bar" class="bg-blue-500 h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <p class="text-2xl font

 
-mono" id="seconds-left">45s</p>
            </div>
        </div>
    </section>

    <!-- Donation Section -->
    <footer class="p-6 bg-gray-800 mt-10 border-t border-gray-700 text-center">
        <h3 class="font-bold text-yellow-500 mb-4">☕ Support Admin</h3>
        <div class="text-sm space-y-2 text-gray-300">
            <p>GCash: 09952533453</p>
            <p>PayPal: otico.isai2@gmail.com</p>
            <p>FaucetPay: otico.isai2@gmail.com</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
