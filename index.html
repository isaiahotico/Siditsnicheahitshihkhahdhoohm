<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎖 PAPERHOUSE INC ADS 🎖</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #080a0f; --card: #161b22; --accent: #00ff88; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Header & Bar Design */
        .header { padding: 20px; text-align: center; background: linear-gradient(to bottom, #161b22, transparent); }
        .status-bar { 
            display: flex; justify-content: space-around; background: var(--card); 
            margin: 10px 15px; padding: 12px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .bar-item { text-align: center; }
        .bar-item small { font-size: 0.65rem; color: #8b949e; display: block; }
        .bar-item b { font-size: 1rem; color: var(--primary); }

        /* Online Indicator */
        .online-chip { background: rgba(0,255,136,0.1); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; border: 1px solid var(--accent); }

        /* Pages */
        .page { display: none; padding: 15px 15px 130px 15px; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .active-page { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Modern Buttons */
        .btn-main { 
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            border: none; color: white; padding: 18px; width: 100%; border-radius: 18px; 
            font-weight: 800; margin-bottom: 12px; transition: 0.3s; font-size: 1rem;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        .btn-main:active { transform: scale(0.96); }

        /* Withdraw History Cards */
        .history-card { 
            background: #1c2128; padding: 15px; border-radius: 15px; margin-bottom: 10px;            border-left: 5px solid var(--secondary); display: flex; justify-content: space-between; align-items: center;
        }
        .status-badge { padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; }
        .paid { background: rgba(0,255,136,0.2); color: var(--accent); }
        .pending { background: rgba(255,193,7,0.2); color: #ffc107; }

        /* Bottom Nav Bar */
        .nav-bar { 
            position: fixed; bottom: 45px; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(20px); 
            display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-link { color: #8b949e; text-align: center; text-decoration: none; font-size: 0.7rem; cursor: pointer; }
        .nav-link.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 5px; }

        .footer { position: fixed; bottom: 0; width: 100%; background: #000; padding: 10px 0; text-align: center; font-size: 0.7rem; color: #484f58; letter-spacing: 1px; }
        
        /* Chat Design */
        .chat-container { background: #0d1117; height: 350px; overflow-y: auto; border-radius: 20px; padding: 15px; margin-bottom: 10px; border: 1px solid #30363d; }
        .msg-bubble { background: #21262d; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; width: fit-content; max-width: 80%; }
        .msg-bubble b { color: var(--primary); font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="margin:0; letter-spacing:2px;">🎖 PAPERHOUSE INC ADS 🎖</h3>
        <div style="margin-top:10px;"><span class="online-chip">● <span id="online-count">1</span> ONLINE</span></div>
    </div>

    <div class="status-bar">
        <div class="bar-item"><small>BALANCE</small><b id="user-bal">₱0.00</b></div>
        <div class="bar-item"><small>WITHDRAWN</small><b id="user-withdrawn" style="color:#8b949e">₱0.00</b></div>
        <div class="bar-item"><small>COMMISSION</small><b style="color:var(--accent)">8%</b></div>
    </div>
    <!-- HOME PAGE -->
    <div id="page-home" class="page active-page">
        <button class="btn-main" onclick="playAd('reward')"><i class="fas fa-play"></i> WATCH PREMIUM AD (+₱0.01)</button>
        <button class="btn-main" style="background: #232a35;" onclick="playAd('pop')"><i class="fas fa-expand"></i> POPUP REWARD (+₱0.01)</button>
        
        <div style="background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #30363d;">
            <p style="margin:0 0 10px 0; font-size: 0.8rem; color: #8b949e;">INVITE FRIENDS (CODE: <span id="ref-id" style="color:white; font-weight:bold;">...</span>)</p>
            <input type="text" id="gcash-box" placeholder="GCash Number" style="width:100%; background:#0d1117; border:1px solid #30363d; color:white; padding:15px; border-radius:12px; box-sizing:border-box; margin-bottom:10px;">
            <button class="btn-main" style="margin:0; background: var(--accent); color: black;" onclick="requestWithdraw()">CASH OUT NOW</button>
        </div>
    </div>

    <!-- HISTORY PAGE -->
    <div id="page-history" class="page">
        <h3 style="margin-bottom:20px;"><i class="fas fa-history"></i> Withdrawal History</h3>
        <div id="history-container">Loading immediate history...</div>
    </div>

    <!-- CHAT PAGE -->
    <div id="page-chat" class="page">
        <div class="chat-container" id="chat-msgs"></div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="msg-input" placeholder="Type message..." style="flex:1; background:#161b22; border:1px solid #30363d; color:white; padding:12px; border-radius:12px;">
            <button onclick="sendChat()" style="background:var(--primary); border:none; border-radius:12px; padding:0 20px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- ADMIN PAGE -->
    <div id="page-admin" class="page">
        <div id="admin-lock">
            <h3>🛡 Admin Access</h3>
            <input type="password" id="admin-key" placeholder="Enter Password" style="width:100%; background:#161b22; border:1px solid #30363d; color:white; padding:15px; border-radius:12px; margin-bottom:10px;">
            <button class="btn-main" onclick="verifyAdmin()">UNLOCK DASHBOARD</button>
        </div>
        <div id="admin-area" style="display:none;">
            <h3>Pending Requests</h3>
            <div id="admin-history"></div>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
        <div class="nav-link active" onclick="nav('home', this)"><i class="fas fa-home"></i>Home</div>
        <div class="nav-link" onclick="nav('history', this)"><i class="fas fa-wallet"></i>History</div>
        <div class="nav-link" onclick="nav('chat', this)"><i class="fas fa-comment-dots"></i>Chat</div>
        <div class="nav-link" onclick="nav('admin', this)"><i class="fas fa-shield-alt"></i>Admin</div>
    </div>

    <div class="footer">
        <span id="foot-date"></span> | <span id="foot-time"></span> | <b>PAPERHOUSE INC Update</b>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
