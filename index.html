<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto In-App Interstitial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag SDK (do NOT async/defer) -->
<script src="//libtl.com/sdk.js"
        data-zone="10337795"
        data-sdk="show_10337795"></script>

<style>
body{
  background:#0e1220;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
}

#statusBtn{
  width:220px;
  height:65px;
  background:linear-gradient(135deg,#ff9800,#ff5722);
  border:none;
  border-radius:16px;
  color:white;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
}

#timer{
  font-size:12px;
  margin-top:4px;
  opacity:.9;
}
</style>
</head>

<body>

<button id="statusBtn">
  📺 In-App Ad Status
  <div id="timer">Initializing…</div>
</button>

<script>
const INTERVAL = 15 * 60 * 1000; // 15 minutes
const KEY = "auto_inapp_last";

const timer = document.getElementById("timer");

function monetagReady(){
  return typeof window.show_10337795 === "function";
}

function showInApp(){
  if(!monetagReady()) return;

  window.show_10337795({
    type: "inApp",
    inAppSettings: {
      frequency: 1,
      capping: 0.25,      // 15 minutes
      interval: 30,
      timeout: 5,
      everyPage: false
    }
  });

  localStorage.setItem(KEY, Date.now());
}

function updateTimer(){
  const last = localStorage.getItem(KEY);

  if(!last){
    timer.textContent = "Showing ad now…";
    showInApp();
    return;
  }

  const diff = Date.now() - last;

  if(diff >= INTERVAL){
    timer.textContent = "Showing ad now…";
    showInApp();
  } else {
    const r = INTERVAL - diff;
    const m = Math.floor(r / 60000);
    const s = Math.floor((r % 60000) / 1000);
    timer.textContent = `Next ad in ${m}:${s.toString().padStart(2,'0')}`;
  }
}

// Check every second
setInterval(updateTimer, 1000);

// Initial delay to allow SDK load
setTimeout(updateTimer, 1500);
</script>

</body>
</html>
