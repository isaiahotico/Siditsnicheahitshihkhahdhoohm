<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL REWARDS INDIE - Full System</title>

<style>
body{
    background:linear-gradient(120deg,#ff9a9e,#fad0c4);
    font-family:'Comic Sans MS',cursive;
    text-align:center;
    padding:20px;
    color:#fff;
}
button{
    padding:12px 25px;
    border:none;
    border-radius:20px;
    background:#ffec61;
    font-size:16px;
    cursor:pointer;
}
button:hover{background:#ffd700}
input{
    padding:10px;
    border-radius:10px;
    border:none;
    margin:5px;
}
#leaderboard,#withdrawLeaderboard{
    background:#fff;
    color:#333;
    padding:10px;
    border-radius:10px;
    display:inline-block;
    max-width:400px;
    text-align:left;
}
#adminDashboard{
    display:none;
    background:#222;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}
#adminTable{
    width:100%;
    background:#fff;
    color:#333;
    border-collapse:collapse;
}
#adminTable th,#adminTable td{
    padding:6px;
    border-bottom:1px solid #ccc;
}
.new-request{background:#fffa8c}
</style>

<script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
</head>

<body>

<h1>🍍 GLOBAL REWARDS INDIE 🍋</h1>

<input id="usernameInput" placeholder="Telegram Username">
<button id="setUsername">Set Username</button>

<h2>Balance: <span id="balance">$0.00</span></h2>
<div id="cpm">Current CPM: $0.00</div>

<div>
<button class="adRoom">🍍 Watch Ad</button>
<button id="dailyBonus">🎁 Daily Bonus</button>
</div>

<h3>Withdraw</h3>
<input id="gcashNumber" placeholder="GCash Number">
<input id="withdrawAmount" type="number" step="0.01" placeholder="USD Amount">
<button id="requestWithdrawBtn">Request Withdraw</button>

<h3>Top Users</h3>
<ul id="leaderboard"></ul>

<h3>Withdrawals</h3>
<ul id="withdrawLeaderboard"></ul>

<hr>

<input id="adminPass" type="password" placeholder="Owner Password">
<button id="adminLoginBtn">Admin Dashboard</button>

<div id="adminDashboard">
<h2>Admin Withdrawal Dashboard</h2>
<table id="adminTable">
<thead>
<tr>
<th>User</th><th>GCash</th><th>$</th><th>₱</th><th>Date</th><th>Status</th><th>Action</th>
</tr>
</thead>
<tbody id="adminTableBody"></tbody>
</table>
</div>

<script>
/* ================== CONSTANTS ================== */
const OWNER_PASSWORD="Propetas6";
const CONVERSION_RATE=55;
const WITHDRAW_COOLDOWN=5*60*1000;

/* ================== STORAGE ================== */
let username=localStorage.getItem("username")||"";
let balance=parseFloat(localStorage.getItem("balance"))||0;
let topUsers=JSON.parse(localStorage.getItem("topUsers"))||[];
let withdrawals=JSON.parse(localStorage.getItem("withdrawals"))||[];
let pendingRequests=JSON.parse(localStorage.getItem("pendingRequests"))||[];

/* ================== SYNC ENGINE ================== */
const syncChannel=new BroadcastChannel("GLOBAL_REWARDS_SYNC");

function syncAll(){
    localStorage.setItem("balance",balance);
    localStorage.setItem("topUsers",JSON.stringify(topUsers));
    localStorage.setItem("withdrawals",JSON.stringify(withdrawals));
    localStorage.setItem("pendingRequests",JSON.stringify(pendingRequests));

    syncChannel.postMessage({
        balance,topUsers,withdrawals,pendingRequests
    });
}

syncChannel.onmessage=e=>{
    balance=e.data.balance;
    topUsers=e.data.topUsers;
    withdrawals=e.data.withdrawals;
    pendingRequests=e.data.pendingRequests;
    updateUI();
};

/* ================== HELPERS ================== */
function updateUI(){
    balanceEl.textContent=`$${balance.toFixed(2)}`;
    leaderboardEl.innerHTML="";
    topUsers.sort((a,b)=>b.balance-a.balance).forEach(u=>{
        leaderboardEl.innerHTML+=`<li>${u.name} - $${u.balance.toFixed(2)}</li>`;
    });
    withdrawLeaderboardEl.innerHTML="";
    withdrawals.forEach(w=>{
        withdrawLeaderboardEl.innerHTML+=`<li>${w.username} - ₱${w.peso}</li>`;
    });
    updateAdminTable();
}

function hasPending(u){
    return pendingRequests.some(r=>r.username===u&&r.status==="Pending");
}
function cooldown(u){
    const t=localStorage.getItem("lastWithdraw_"+u);
    return t && Date.now()-t<WITHDRAW_COOLDOWN;
}

/* ================== UI ELEMENTS ================== */
const balanceEl=document.getElementById("balance");
const leaderboardEl=document.getElementById("leaderboard");
const withdrawLeaderboardEl=document.getElementById("withdrawLeaderboard");
const adminBody=document.getElementById("adminTableBody");

/* ================== USER ================== */
document.getElementById("setUsername").onclick=()=>{
    const u=usernameInput.value.trim();
    if(!u) return alert("Enter username");
    username=u;
    localStorage.setItem("username",u);
    if(!topUsers.find(x=>x.name===u)) topUsers.push({name:u,balance});
    syncAll();
};

/* ================== ADS ================== */
document.querySelector(".adRoom").onclick=()=>{
    if(!username) return alert("Set username");
    show_10337795().then(()=>{
        const r=Math.random()*0.15+0.05;
        balance+=r;
        const u=topUsers.find(x=>x.name===username);
        if(u) u.balance=balance;
        syncAll();
    });
};

/* ================== DAILY ================== */
dailyBonus.onclick=()=>{
    if(!username) return;
    show_10337795().then(()=>{
        const b=Math.random()*0.5+0.5;
        balance+=b;
        const u=topUsers.find(x=>x.name===username);
        if(u) u.balance=balance;
        syncAll();
    });
};

/* ================== WITHDRAW ================== */
requestWithdrawBtn.onclick=()=>{
    if(!username) return alert("Set username");
    if(hasPending(username)) return alert("Pending withdrawal exists");
    if(cooldown(username)) return alert("Please wait before retry");

    const g=gcashNumber.value.trim();
    const a=parseFloat(withdrawAmount.value);
    if(!g||!a||a>balance) return alert("Invalid");

    pendingRequests.push({
        id:crypto.randomUUID(),
        username,
        gcash:g,
        usd:a,
        peso:a*CONVERSION_RATE,
        date:new Date().toLocaleString(),
        status:"Pending"
    });

    localStorage.setItem("lastWithdraw_"+username,Date.now());
    syncAll();
};

/* ================== ADMIN ================== */
adminLoginBtn.onclick=()=>{
    if(adminPass.value===OWNER_PASSWORD){
        adminDashboard.style.display="block";
        updateAdminTable();
    }else alert("Wrong password");
};

function updateAdminTable(){
    adminBody.innerHTML="";
    pendingRequests.forEach((r,i)=>{
        adminBody.innerHTML+=`
        <tr class="${r.status==="Pending"?"new-request":""}">
        <td>${r.username}</td>
        <td>${r.gcash}</td>
        <td>$${r.usd}</td>
        <td>₱${r.peso}</td>
        <td>${r.date}</td>
        <td>${r.status}</td>
        <td>
        <button onclick="approve(${i})">✔</button>
        <button onclick="deny(${i})">✖</button>
        </td>
        </tr>`;
    });
}

window.approve=i=>{
    if(pendingRequests[i].status!=="Pending")return;
    pendingRequests[i].status="Approved";
    withdrawals.push(pendingRequests[i]);
    const u=topUsers.find(x=>x.name===pendingRequests[i].username);
    if(u) u.balance-=pendingRequests[i].usd;
    if(username===u?.name) balance=u.balance;
    syncAll();
};

window.deny=i=>{
    if(pendingRequests[i].status!=="Pending")return;
    pendingRequests[i].status="Denied";
    syncAll();
};

/* ================== CPM ================== */
setInterval(()=>cpm.textContent="Current CPM: $"+(Math.random()*2+0.5).toFixed(2),5000);

/* INIT */
updateUI();
</script>
</body>
</html>
