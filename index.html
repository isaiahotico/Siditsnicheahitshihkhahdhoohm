<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeCoin - Watch & Earn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body { background: #0f0f0f; color: white; }
        .card { background: #1e1e1e; border: 1px solid #333; color: white; }
        #live-feed { height: 150px; overflow-y: hidden; border-left: 3px solid #ff0000; padding-left: 10px; }
        .feed-item { font-size: 0.9rem; margin-bottom: 5px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        #player-container { aspect-ratio: 16/9; width: 100%; background: #000; }
        .coin-badge { background: #ffd700; color: #000; font-weight: bold; padding: 5px 12px; border-radius: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Tube<span class="text-danger">Coin</span></a>
        <div class="d-flex align-items-center">
            <span id="user-display" class="me-3">@Guest</span>
            <span class="coin-badge">💰 <span id="balance">0</span> Coins</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <!-- Sidebar: Add Video & Stats -->
        <div class="col-md-4">
            <div class="card p-3 mb-3">
                <h5>Add Your Video</h5>
                <p class="small text-muted">First 5 free, then 50 coins/link.</p>
                <input type="text" id="video-url" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="YouTube Video URL">
                <button onclick="submitVideo()" class="btn btn-danger w-100">Submit Link</button>
                <div id="link-count-info" class="mt-2 small">Links used: 0/5</div>
            </div>

            <div class="card p-3">
                <h5>Live Activities</h5>
                <div id="live-feed">
                    <!-- Telegram usernames appear here real-time -->
                </div>
            </div>
        </div>

        <!-- Main: Video Player -->
        <div class="col-md-8">
            <div class="card p-3">
                <div id="player-container">
                    <div id="player"></div>
                </div>
                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 id="video-title">Select a video to start earning</h6>
                        <small class="text-success" id="timer-status"></small>
                    </div>
                    <button onclick="loadNextVideo()" class="btn btn-outline-light btn-sm">Skip Video</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>

<!-- Firebase App (Modular) -->
<script type="module" src="app.js"></script>
</body>
</html>
