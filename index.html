<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL KAYEE - Global Indie Ads</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="10337795" data-sdk="show_10337795"></script>
<style>
/* --- Indie Theme --- */
body { background: linear-gradient(135deg,#ff9a9e,#fad0c4); font-family: 'Comic Sans MS', cursive; text-align:center; color:#fff; margin:0; padding:0; }
header { padding:20px; }
h1 { font-size:2rem; }
button { padding:10px 20px; margin:10px; border:none; border-radius:12px; background: linear-gradient(135deg,#667eea,#764ba2); color:#fff; cursor:pointer; font-size:1rem; }
button:hover { transform: scale(1.05); }
section { padding:20px; }
input { padding:8px; margin:5px; border-radius:8px; border:none; }
table { width:90%; margin:auto; border-collapse:collapse; color:#000; background:#fff; border-radius:10px; overflow:hidden; margin-bottom:30px;}
th, td { padding:10px; border-bottom:1px solid #ddd; }
a { color:#fff; text-decoration:none; background:#764ba2; padding:8px 12px; border-radius:10px; display:inline-block; margin-top:10px;}
</style>
</head>
<body>

<header>
<h1>🎬 SENTINEL KAYEE 🎬</h1>
<p>Watch ads, earn Peso rewards!</p>
</header>

<section id="ads-section">
<h2>Watch Ads</h2>
<button id="rewardedInterstitial">🎯 Rewarded Interstitial</button>
<button id="rewardedPopup">💥 Rewarded Popup</button>
<button id="inAppInterstitial">📱 In-App Interstitial</button>
</section>

<section id="wallet-section">
<h2>Wallet: ₱<span id="userBalance">0</span></h2>
<h3>Withdraw Funds</h3>
<form id="withdrawForm">
<input type="number" id="withdrawAmount" placeholder="Amount ₱" required min="50">
<input type="text" id="gcashNumber" placeholder="Gcash Number" required>
<button type="submit">Withdraw</button>
</form>
</section>

<section id="admin-section">
<h2>Admin Dashboard 🔑</h2>
<div id="loginDiv">
<input type="password" id="adminPass" placeholder="Enter Admin Password">
<button onclick="loginAdmin()">Login</button>
</div>
<div id="dashboard" style="display:none;">
<h3>All Withdrawals</h3>
<table id="withdrawalsTable">
<thead><tr><th>User</th><th>Amount</th><th>Gcash</th><th>Status</th><th>Action</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>

<script>
// --- Supabase Setup ---
const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- Telegram WebApp ---
let username = null;
let userBalance = 0;

function initTelegram() {
    const tg = window.Telegram.WebApp;
    tg.expand();
    username = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.id;

    // Create user profile if not exists
    supabase.from('profiles').upsert({username, balance:0}).then(() => loadBalance());
}

// --- Load Balance ---
async function loadBalance() {
    const { data } = await supabase.from('profiles').select('balance').eq('username', username).single();
    if(data) userBalance = data.balance || 0;
    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
}

// --- Reward User ---
async function rewardUser(amount){
    userBalance += amount;
    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
    await supabase.from('profiles').upsert({username, balance:userBalance}, {onConflict:'username'});
}

// --- Ads Events ---
document.getElementById('rewardedInterstitial').addEventListener('click',()=>{
    show_10337795().then(()=>rewardUser(50));
});
document.getElementById('rewardedPopup').addEventListener('click',()=>{
    show_10337795('pop').then(()=>rewardUser(50)).catch(e=>console.error(e));
});
document.getElementById('inAppInterstitial').addEventListener('click',()=>{
    show_10337795({
        type:'inApp',
        inAppSettings:{frequency:2, capping:0.1, interval:30, timeout:5, everyPage:false}
    }).then(()=>rewardUser(50));
});

// --- Withdrawal Form ---
document.getElementById('withdrawForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    const gcash = document.getElementById('gcashNumber').value;

    if(amount>userBalance){ alert('Insufficient balance'); return; }

    // Insert withdrawal request directly to Supabase
    await supabase.from('withdrawals').insert({username, amount, gcash_number:gcash, status:'pending'});
    userBalance -= amount;
    await supabase.from('profiles').upsert({username, balance:userBalance});
    document.getElementById('userBalance').innerText = userBalance.toFixed(2);
    alert('Withdrawal requested successfully!');
});

// --- Admin Login ---
function loginAdmin(){
    const pass = document.getElementById('adminPass').value;
    if(pass==='Propetas6'){
        document.getElementById('loginDiv').style.display='none';
        document.getElementById('dashboard').style.display='block';
        loadWithdrawals();
    } else alert('Incorrect password!');
}

// Load withdrawals for admin
async function loadWithdrawals(){
    const { data } = await supabase.from('withdrawals').select('*');
    const tbody = document.querySelector('#withdrawalsTable tbody');
    tbody.innerHTML='';
    data.forEach(w=>{
        const tr = document.createElement('tr');
        tr.innerHTML=`
            <td>${w.username}</td>
            <td>₱${w.amount}</td>
            <td>${w.gcash_number}</td>
            <td>${w.status}</td>
            <td>
                <button onclick="updateStatus('${w.id}','approved')">✅ Approve</button>
                <button onclick="updateStatus('${w.id}','denied')">❌ Deny</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Update withdrawal status
async function updateStatus(id,status){
    await supabase.from('withdrawals').update({status}).eq('id',id);
    loadWithdrawals();
}

// Initialize Telegram WebApp
if(window.Telegram && window.Telegram.WebApp){
    initTelegram();
} else {
    alert('Please open inside Telegram WebApp');
}
</script>
</body>
</html>
