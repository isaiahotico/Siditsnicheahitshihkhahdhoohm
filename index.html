
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎖 PAPERHOUSE INC ADS 🎖</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #0b0e14; --card: #1a1f29; --accent: #00ff88; --gold: #ffd700; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; overflow-x: hidden; }
        
        .header { padding: 15px; text-align: center; background: linear-gradient(to bottom, #1a1f29, transparent); }
        .status-bar { display: flex; justify-content: space-around; background: var(--card); margin: 0 15px 15px; padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .bar-item { text-align: center; }
        .bar-item small { font-size: 0.6rem; color: #8b949e; display: block; text-transform: uppercase; }
        .bar-item b { font-size: 1.1rem; color: var(--primary); }

        /* Referral Advanced Box */
        .ref-container { background: linear-gradient(135deg, #1a1f29, #111); margin: 0 15px 15px; padding: 15px; border-radius: 20px; border: 1px solid var(--primary); }
        .ref-stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.8rem; border-top: 1px solid #333; padding-top: 10px; }
        
        /* Game Section */
        #game-canvas { background: #000; display: block; margin: 0 auto; border-radius: 15px; border: 2px solid #333; width: 100%; max-width: 320px; height: 150px; }

        .page { display: none; padding: 10px 15px 130px 15px; animation: fadeIn 0.4s ease; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-main { background: linear-gradient(135deg, var(--secondary), var(--primary)); border: none; color: #000; padding: 16px; width: 100%; border-radius: 15px; font-weight: 800; margin-bottom: 10px; cursor: pointer; }
        .btn-game { background: var(--gold); color: black; }

        .history-card { background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--secondary); }
        .status-paid { color: var(--accent); font-weight: bold; }
        .status-pending { color: #ffcc00; font-weight: bold; }

        .nav-bar { position: fixed; bottom: 45px; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: rgba(26, 31, 41, 0.95); display: flex; justify-content: space-around; padding: 15px 0; backdrop-filter: blur(10px); border-top: 1px solid #333; }
        .nav-item { color: #666; text-align: center; font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.3rem; display: block; }

        .footer { position: fixed; bottom: 0; width: 100%; background: #000; font-size: 0.65rem; text-align: center; padding: 8px 0; color: #555; }
        input { width: 100%; background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 10px; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="margin:0;">🎖 PAPERHOUSE INC ADS 🎖</h3>
        <span id="online-count" style="font-size:0.7rem; color:var(--accent);">● 1 Online</span>
    </div>

    <div class="status-bar">
        <div class="bar-item"><small>Wallet</small><b id="u-bal">₱0.00</b></div>
        <div class="bar-item"><small>Withdrawn</small><b id="u-withdrawn">₱0.00</b></div>
        <div class="bar-item"><small>Barriers</small><b id="u-barriers" style="color:var(--gold)">0</b></div>
    </div>

    <!-- HOME PAGE -->
    <div id="p-home" class="page active-page">
        <div class="ref-container">
            <small style="color:var(--secondary)">ADVANCED REFERRAL SYSTEM</small>
            <div style="display:flex; gap:10px; margin-top:5px;">
                <input type="text" id="ref-input" placeholder="Enter Invite Code" style="margin:0;">
                <button onclick="applyRef()" style="background:var(--primary); border:none; border-radius:10px; padding:0 15px;">Apply</button>
            </div>
            <div class="ref-stats">
                <span>Friends: <b id="u-friends">0</b></span>
                <span>Earned: <b id="u-ref-earn">₱0.00</b></span>
                <span>Your Code: <b id="u-mycode" style="color:var(--primary)">...</b></span>
            </div>
        </div>

        <button class="btn-main" onclick="watchAd('reward')">📺 WATCH AD (+₱0.01)</button>
        <button class="btn-main" style="background:#222; color:white;" onclick="watchAd('pop')">💎 POPUP AD (+₱0.01)</button>
        
        <div style="background:var(--card); padding:15px; border-radius:20px;">
            <input type="number" id="gcash-num" placeholder="GCash Number (09...)">
            <button class="btn-main" style="background:var(--accent); color:black; margin:0;" onclick="withdraw()">WITHDRAW NOW</button>
        </div>
    </div>

    <!-- GAME PAGE -->
    <div id="p-game" class="page">
        <h3 style="text-align:center; color:var(--gold);">🕹 DASHJAM MINI</h3>
        <p style="font-size:0.7rem; text-align:center; margin-top:-10px;">2,000 Barriers = ₱1.00</p>
        <canvas id="game-canvas"></canvas>
        <button class="btn-main btn-game" style="margin-top:15px;" onclick="startGame()">TAP TO START / JUMP</button>
    </div>

    <!-- HISTORY PAGE -->
    <div id="p-history" class="page">
        <h3>📊 Activity History</h3>
        <div id="history-list">Loading records...</div>
    </div>

    <!-- CH

AT PAGE -->
    <div id="p-chat" class="page">
        <div id="chat-box" style="height:300px; overflow-y:auto; background:#0d1117; border-radius:15px; padding:15px; margin-bottom:10px;"></div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="chat-in" placeholder="Say something..." style="margin:0;">
            <button onclick="sendMsg()" style="background:var(--primary); border:none; border-radius:10px; padding:0 20px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- ADMIN PAGE -->
    <div id="p-admin" class="page">
        <div id="admin-login">
            <input type="password" id="admin-pass" placeholder="Admin Password">
            <button class="btn-main" onclick="checkAdmin()">LOGIN</button>
        </div>
        <div id="admin-content" style="display:none;">
            <h3>Pending Cashouts</h3>
            <div id="admin-list"></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="nav('home', this)"><i class="fas fa-home"></i>Home</div>
        <div class="nav-item" onclick="nav('game', this)"><i class="fas fa-gamepad"></i>Game</div>
        <div class="nav-item" onclick="nav('history', this)"><i class="fas fa-history"></i>History</div>
        <div class="nav-item" onclick="nav('chat', this)"><i class="fas fa-comments"></i>Chat</div>
        <div class="nav-item" onclick="nav('admin', this)"><i class="fas fa-user-shield"></i>Admin</div>
    </div>

    <div class="footer">
        <span id="f-date"></span> | <span id="f-time"></span> | <b>PAPERHOUSE INC ADS Update</b>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
