<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Telegram Ad App</title>

<script src="https://inapp.telega.io/sdk/v1/sdk.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.header{
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.balance{
  font-size:22px;
  margin:10px;
  color:#00ff99;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  margin:10px;
  font-size:16px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:disabled{
  background:gray;
}

#banner-container{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:center;
  z-index:9999;
  background:#111827;
  padding:5px 0;
}
</style>
</head>
<body>

<div class="header">🏆 Professional Ad System</div>

<div class="balance">
Balance: ₱<span id="balance">0.000</span>
</div>

<button onclick="watchReward()">🎁 Watch Reward Ad (₱0.01)</button>
<br>
<span id="cooldownText"></span>

<div id="banner-container"></div>

<script>

// ===== SETTINGS =====
const REWARD_AMOUNT = 0.01;
const COOLDOWN_SECONDS = 60; // 1 min cooldown
const BANNER_REFRESH = 60000; // 60 sec

let balance = 0;
let cooldown = false;

// ===== INIT TELOGA =====
const ads = window.TelegaIn.AdsController.create_miniapp({
  token: 'YOUR_TOKEN'
});

// ===== STICKY BANNER =====
function loadBanner(){
  ads.ad_show({
    adBlockUuid: "YOUR_BANNER_UUID",
    containerId: "banner-container"
  });
}

loadBanner();
setInterval(loadBanner, BANNER_REFRESH); // auto refresh

// ===== REWARD AD =====
function watchReward(){

  if(cooldown){
    alert("Please wait for cooldown.");
    return;
  }

  ads.ad_show({
    adBlockUuid: "YOUR_REWARD_UUID"
  });

  // PROFESSIONAL LOGIC:
  // You should verify reward callback from backend.
  // This is demo auto-reward after 5 seconds.

  setTimeout(() => {
    grantReward();
  }, 5000);
}

function grantReward(){
  balance += REWARD_AMOUNT;
  document.getElementById("balance").innerText = balance.toFixed(3);

  startCooldown();
}

// ===== COOLDOWN SYSTEM =====
function startCooldown(){
  cooldown = true;
  let seconds = COOLDOWN_SECONDS;

  const interval = setInterval(() => {
    seconds--;
    document.getElementById("cooldownText").innerText =
      "Cooldown: " + seconds + " sec";

    if(seconds <= 0){
      clearInterval(interval);
      cooldown = false;
      document.getElementById("cooldownText").innerText = "";
    }
  }, 1000);
}

</script>

</body>
</html>
