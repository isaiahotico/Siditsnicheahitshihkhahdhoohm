<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #070707; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn.active { color: gold; border-top: 2px solid gold; }
        
        #reward-pop { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; }
        table { width: 100%; font-size: 11px; text-align: left; }
        th { color: gold; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .PENDING { color: orange; } .APPROVED { color: limegreen; } .REJECTED { color: red; }
    </style>
</head>
<body class="pb-24">
    <div id="reward-pop" class="glass p-8 rounded-3xl text-center border-2 border-yellow-500 shadow-2xl">
        <div class="text-6xl mb-4">💎</div>
        <h2 class="text-2xl font-black text-yellow-500 uppercase">Success!</h2>
        <p id="pop-amt" class="text-xl font-bold mt-2"></p>
        <button onclick="closePop()" class="mt-6 bg-yellow-600 px-10 py-2 rounded-full font-bold">CLAIM</button>
    </div>

    <header class="p-4 glass sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xs font-black text-yellow-500">🎖 PAPERHOUSE INC</h1>
            <p class="text-[10px] opacity-60">@<span id="display-username">...</span></p>
        </div>
        <div class="text-right">
            <p class="text-green-400 font-black text-lg">₱<span id="balance">0.0000</span></p>
            <p class="text-blue-400 text-[10px] font-bold"><span id="pts">0</span> Chat Pts</p>
        </div>
    </header>

    <div class="p-4 space-y-4">
        <!-- HOME SECTION -->
        <section id="home" class="tab-content active space-y-4">
            <div class="glass p-6 rounded-2xl text-center">
                <button onclick="runAd('normal')" id="btn-normal" class="w-full bg-yellow-600 py-4 rounded-xl font-black shadow-lg">WATCH AD (₱0.0102)</button>
                <p id="t-normal" class="text-[9px] mt-2 opacity-40">Ready</p>
            </div>
            <div class="glass p-6 rounded-2xl text-center border-purple-500/20">
                <button onclick="runAd('turbo')" id="btn-turbo" class="w-full bg-purple-600 py-4 rounded-xl font-black shadow-lg">TURBO ADS 🚀 (₱0.0120)</button>
                <p id="t-turbo" class="text-[9px] mt-2 opacity-40">45s Cooldown</p>
            </div>
            <div class="glass p-6 rounded-2xl text-center border-blue-500/20">
                <button onclick="runAd('points')" id="btn-points" class="w-full bg-blue-600 py-4 rounded-xl font-black shadow-lg">EARN 1 CHAT POINT ✨</button>
                <p id="t-points" class="text-[9px] mt-2 opacity-40">5m Cooldown</p>
            </div>
        </section>

        <!-- CHAT SECTION -->
        <section id="chat" class="tab-content">
            <div class="glass rounded-2xl h-[60vh] flex flex-col">
                <div id="chat-box" class="flex-grow p-4 overflow-y-auto space-y-2 text-xs"></div>
                <div class="p-2 border-t border-white/5 flex gap-2">
                    <input type="text" id="chat-in" class="flex-grow bg-white/5 rounded px-3 text-xs" placeholder="Message (1 Pt)">
                    <button onclick="sendChat()" class="bg-yellow-600 px-4 py-2 rounded"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <!-- REFERRAL SECTION -->
        <section id="referral" class="tab-content space-y-4">
            <div class="glass p-6 rounded-2xl text-center" id="ref-input-area">
                <h3 class="text-yellow-500 font-bold mb-2">Referral Code</h3>
                <input type="text" id="ref-code" placeholder="Enter Referrer Username" class="w-full bg-white/5 p-3 rounded-lg mb-3 text-center border border-yellow-500/20">
                <button onclick="setReferrer()" class="w-full bg-yellow-600 py-2 rounded-xl font-bold">Link Referrer</button>
            </div>
            <div class="glass p-6 rounded-2xl text-center">
                <p class="text-xs opacity-60">Unclaimed 8% Bonus</p>
                <h2 class="text-2xl font-black text-green-400">₱<span id="unclaimed-bal">0.0000</span></h2>
                <button onclick="claimRefBonus()" class="mt-4 w-full bg-green-600 py-3 rounded-xl font-bold">CLAIM TO BALANCE</button>
            </div>
        </section>

        <!-- LEADERBOARD SECTION -->
        <section id="leaderboard" class="tab-content">
            <div class="glass p-4 rounded-2xl">
                <h3 class="text-center text-yellow-500 font-bold mb-4 uppercase">Top Earners</h3>
                <div id="leader-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- WALLET SECTION -->
        <section id="wallet" class="tab-content space-y-4">
            <div class="glass p-6 rounded-2xl">
                <input id="gcashName" placeholder="GCash Full Name" class="w-full bg-white/5 p-3 rounded-lg mb-2 text-xs border border-white/10">
                <input id="gcashNumber" placeholder="GCash Number" class="w-full bg-white/5 p-3 rounded-lg mb-2 text-xs border border-white/10">
                <input id="withdrawAmount" placeholder="Amount" type="number" class="w-full bg-white/5 p-3 r

ounded-lg mb-4 text-xs border border-white/10">
                <button onclick="requestWithdraw()" class="w-full bg-green-600 py-3 rounded-xl font-bold uppercase">Request Withdrawal</button>
            </div>
            <div class="glass rounded-2xl overflow-x-auto">
                <table>
                    <thead><tr><th>Date</th><th>GCash</th><th>Amount</th><th>Status</th></tr></thead>
                    <tbody id="withdrawTable"></tbody>
                </table>
            </div>
        </section>

        <!-- ADMIN SECTION -->
        <section id="admin" class="tab-content space-y-4">
            <div id="admin-gate" class="glass p-6 rounded-2xl">
                <input id="adminPass" type="password" placeholder="Admin Password" class="w-full bg-white/5 p-3 rounded-lg mb-4">
                <button onclick="openAdmin()" class="w-full bg-red-600 py-3 rounded-xl font-bold">Access Dashboard</button>
            </div>
            <div id="adminPanel" class="hidden glass p-4 rounded-2xl overflow-x-auto">
                <h3 class="text-yellow-500 font-bold mb-4">Admin Withdrawals</h3>
                <table>
                    <thead><tr><th>User</th><th>GCash</th><th>Amount</th><th>Action</th></tr></thead>
                    <tbody id="adminWithdrawTable"></tbody>
                </table>
            </div>
        </section>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 glass h-20 flex justify-around items-center z-[100]">
        <button onclick="tab('home')" id="n-home" class="nav-btn p-2 flex flex-col items-center active"><i class="fas fa-home text-sm"></i><span class="text-[9px]">Home</span></button>
        <button onclick="tab('chat')" id="n-chat" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-comment text-sm"></i><span class="text-[9px]">Chat</span></button>
        <button onclick="tab('referral')" id="n-referral" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-users text-sm"></i><span class="text-[9px]">Invite</span></button>
        <button onclick="tab('leaderboard')" id="n-leaderboard" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-trophy text-sm"></i><span class="text-[9px]">Top</span></button>
        <button onclick="tab('wallet')" id="n-wallet" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-wallet text-sm"></i><span class="text-[9px]">Wallet</span></button>
        <button onclick="tab('admin')" id="n-admin" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-lock text-sm"></i><span class="text-[9px]">Admin</span></button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
