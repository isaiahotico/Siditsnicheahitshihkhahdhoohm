<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium YT Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; }
        .tg-gradient { background: linear-gradient(135deg, #24A1DE, #0088CC); }
        #player { border-radius: 12px; overflow: hidden; width: 100%; aspect-ratio: 16/9; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4">
    <!-- Header: User Display -->
    <div class="flex items-center justify-between mb-6 glass p-4 rounded-2xl border border-gray-800">
        <div class="flex items-center gap-3">
            <div id="user-photo" class="w-10 h-10 rounded-full tg-gradient flex items-center justify-center font-bold">?</div>
            <div>
                <p class="text-xs text-gray-400">Welcome,</p>
                <p id="username" class="font-bold text-blue-400">Loading...</p>
            </div>
        </div>
        <i class="fab fa-youtube text-red-600 text-3xl"></i>
    </div>

    <!-- YouTube Player -->
    <div id="player-container" class="mb-6 shadow-2xl">
        <div id="player"></div>
    </div>

    <!-- Input Section -->
    <div class="flex gap-2 mb-6">
        <input type="text" id="video-url" placeholder="Paste YouTube Link here..." 
               class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-sm">
        <button onclick="addToPlaylist()" class="tg-gradient px-6 py-3 rounded-xl font-bold">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Playlist Section -->
    <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-bold">Up Next</h2>
        <span id="queue-count" class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-400">0 Videos</span>
    </div>
    
    <div id="playlist" class="space-y-3 pb-20">
        <!-- Playlist items injected here -->
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
