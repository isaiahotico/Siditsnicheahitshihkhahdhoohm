<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <style>
        body {
            background: radial-gradient(circle, #2c2c2c 0%, #000000 100%);
            color: #f3cf7a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border: 2px solid #bf953f;
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.4);
        }
        .gold-btn {
            background: linear-gradient(to bottom, #fcf6ba 0%, #bf953f 100%);
            color: #000;
            font-weight: bold;
            transition: 0.3s;
        }
        .gold-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #fcf6ba;
        }
        .gold-btn:disabled {
            background: #444;
            color: #888;
            transform: none;
            box-shadow: none;
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            border: 1px solid #bf953f;
        }
    </style>
</head>
<body class="p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold gold-gradient italic">🎖🤑PAPERHOUSE INC ADS🤑🎖</h1>
        <p class="text-xs text-yellow-500">Fast Rewards & Chat Mining</p>
    </div>

    <!-- Balance Card -->
    <div class="gold-border rounded-xl p-4 mb-6 bg-black/40 text-center">
        <p class="text-gray-400 text-sm">Your Balance</p>
        <h2 class="text-4xl font-bold text-white">₱ <span id="user-balance">0.00</span></h2>
        <div class="flex justify-around mt-4">
            <div>
                <p class="text-xs text-gray-400">Chat Points</p>
                <p id="user-points" class="font-bold text-yellow-300">0</p>
            </div>
            <div>
                <p class="text-xs text-gray-400">Min. Withdraw</p>
                <p class="font-bold text-green-500">₱ 0.02</p>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <button id="btn-watch-ad" class="gold-btn py-3 rounded-lg shadow-lg">📺 WATCH AD<br><span class="text-[10px]">+₱0.01 & 1 PT</span></button>
        <button onclick="openWithdraw()" class="gold-btn py-3 rounded-lg shadow-lg bg-green-500">💸 WITHDRAW<br><span class="text-[10px]">GCASH</span></button>
    </div>

    <!-- Chat Room -->
    <div class="gold-border rounded-xl p-2 bg-black/60 mb-6">
        <h3 class="text-center gold-gradient font-bold mb-2">GOLD CHAT ROOM</h3>
        <div id="chat-messages" class="chat-box p-2 text-sm space-y-2 mb-2">
            <!-- Messages load here -->
        </div>
        <div class="flex gap-2">
            <input id="chat-input" type="text" placeholder="Send message (1 PT)..." class="flex-1 bg-black border border-yellow-700 p-2 rounded text-white outline-none">
            <button id="btn-send-chat" class="gold-btn px-4 rounded">SEND</button>
        </div>
        <p id="cooldown-timer" class="text-[10px] text-red-500 mt-1 hidden text-center">Cooldown: <span id="timer-sec">300</span>s</p>
    </div>

    <!-- Leaderboard -->
    <div class="mb-6">
        <h3 class="text-center gold-gradient font-bold mb-2">🏆 TOP EARNERS</h3>
        <div id="leaderboard" class="space-y-1">
            <!-- Top 5 users -->
        </div>
    </div>

    <!-- Admin & Withdraw Modals (Hidden) -->
    <div id="modal-withdraw" class="fixed inset-0 bg-black/90 hidden z-50 p-6">
        <div class="gold-border p-6 rounded-xl bg-gray-900">
            <h2 class="text-xl gold-gradient mb-4">Withdraw to GCash</h2>
            <input id="wd-name" type="text" placeholder="Full Name" class="w-full mb-2 p-2 bg-black border border-yellow-600">
            <input id="wd-number" type="number" placeholder="GCash Number" class="w-full mb-4 p-2 bg-black border border-yellow-600">
            <button onclick="submitWithdraw()" class="gold-btn w-full py-2">SUBMIT REQUEST</button>
            <button onclick="closeModal()" class="w-full mt-2 text-gray-500">Cancel</button>
        </div>
    </div>

    <!-- Owner Dashboard Access -->
    <div class="mt-10 opacity-20 text-center">
        <button onclick="accessAdmin()" class="text-[10px]">Owner Login</button>
    </div>

    <div id="owner-dashboard" class="fixed inset-0 bg-black hidden z-50 overflow-y-auto p-4">
        <h1 class="text-2xl gold-gradient text-center mb-4">OWNER PANEL</h1>
        <div id="payout-history" class="space-y-2">
            <!-- Payouts load here -->
        </div>
        <button onclick="location.reload()" class="fixed bottom-4 right-4 bg-red-600 p-2 rounded">Close</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
