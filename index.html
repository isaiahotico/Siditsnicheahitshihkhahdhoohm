            // Sync Leaderboard & Chat
            db.ref('users').orderByChild('balance').limitToLast(10).on('value', snap => {

        function watchAd(idx) {
            window.open(adLinks[idx], '_blank');
            setTimeout(() => {

        function startTimer(idx, lastTime) {
            const btn = document.getElementById('btn-'+idx);
            const overlay = document.getElementById('cd-'+idx);
            btn.disabled = true;
            overlay.style.display = 'flex';

            let itv = setInterval(() => {
                let diff = Math.floor((Date.now() - lastTime) / 1000);
                let remaining = 200 - diff;
                if(remaining <= 0) {
                    clearInterval(itv);
                    btn.disabled = false;
                    overlay.style.display = 'none';
                } else {
                    overlay.innerText = remaining + "s";
                }
            }, 1000);
        }

        function applyRef() {
            const code = document.getElementById('refer-in').value.toUpperCase();
            if(code === myData.myRefCode) return alert("Cannot use own code");
            
            db.ref('users').orderByChild('myRefCode').equalTo(code).once('value', snap => {
                if(snap.exists()) {
                    let refererId = Object.keys(snap.val())[0];
                    db.ref('users/' + userId).update({ referredBy: refererId });
                    db.ref('users/' + refererId).transaction(u => {
                        if(u) u.refCount = (u.refCount || 0) + 1;
                        return u;
                    });
                    alert("Code Applied! You are now earning for your friend too.");
                } else {
                    alert("Invalid Code");
                }
            });
        }

        function processWithdraw() {
            if(myData.balance < 1.00) return alert("Minimum withdrawal is ₱1.00");
            const info = document.getElementById('pay-info').value;
            if(info.length < 5) return alert("Enter valid details");

            db.ref('withdrawals').push({
                userId: userId, amount: myData.balance,
                method: document.getElementById('pay-method').value,
                info: info, status: "Pending"
            });
            db.ref('users/' + userId).update({ balance: 0 });
            alert("Request Sent!");
        }
