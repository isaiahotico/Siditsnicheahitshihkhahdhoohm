<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL REWARDS INDIE - Full System</title>
<style>
body { background: linear-gradient(120deg,#ff9a9e,#fad0c4); font-family:'Comic Sans MS',cursive,sans-serif; text-align:center; padding:20px; color:#fff; }
h1 { font-size:2rem; margin-bottom:10px; }
#balance { font-size:2rem; margin:15px 0; }
button { font-size:18px; padding:12px 25px; margin:5px; border-radius:20px; border:none; cursor:pointer; background:#ffec61; color:#333; box-shadow:0 4px 8px rgba(0,0,0,0.2); transition:0.2s; }
button:hover { transform:scale(1.05); background:#ffd700; }
#leaderboard,#withdrawLeaderboard { display:inline-block; text-align:left; margin-top:20px; color:#333; background:#fff; border-radius:10px; padding:10px; max-width:400px; }
#leaderboard li,#withdrawLeaderboard li { margin:5px 0; font-weight:bold; }
#cpm { margin:10px 0; font-size:1.2rem; }
.room-buttons { display:flex; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
.confetti { position:absolute; width:10px; height:10px; z-index:1000; animation:fall 1s linear forwards; }
@keyframes fall { 0%{transform:translateY(0px);opacity:1;} 100%{transform:translateY(400px) rotate(360deg);opacity:0;} }
#usernameInput,#gcashNumber,#withdrawAmount,#adminPass { padding:10px; border-radius:10px; border:none; margin-bottom:15px; font-size:16px; }
#adminDashboard { display:none; border:2px solid #fff; padding:10px; margin-top:20px; background:#222; color:#fff; overflow-x:auto; }
#adminTable { width:100%; border-collapse:collapse; margin-top:10px; color:#333; background:#fff; }
#adminTable th,#adminTable td { padding:8px; border-bottom:1px solid #ccc; text-align:center; }
</style>
</head>
<body>

<h1>🍍 GLOBAL REWARDS INDIE 🍋</h1>

<div>
<input type="text" id="usernameInput" placeholder="Enter Username">
<button id="setUsernameBtn">Set Username</button>
</div>

<div>Balance: $<span id="balance">0.00</span></div>
<div id="cpm">Current CPM: $0.00</div>

<div class="room-buttons">
<button class="adRoom" data-reward="0.05">🍍 Room 1 ($0.05-$0.15)</button>
<button class="adRoom" data-reward="0.1">🍋 Room 2 ($0.05-$0.15)</button>
<button class="adRoom" data-reward="0.2">🎉 Room 3 ($0.05-$0.20)</button>
</div>

<button id="dailyBonusBtn">🎁 Daily Bonus</button>

<div>
<input type="text" id="gcashNumber" placeholder="Enter GCash Number">
<input type="number" id="withdrawAmount" placeholder="Amount to withdraw ($)" step="0.01">
<button id="withdrawBtn">💵 Request Withdraw</button>
</div>

<h2>Leaderboard</h2>
<ul id="leaderboard"></ul>

<h2>Withdrawals</h2>
<ul id="withdrawLeaderboard"></ul>

<div id="adminDashboard">
<h2>Admin Withdrawal Dashboard</h2>
<input type="password" id="adminPass" placeholder="Owner Password">
<button id="adminLoginBtn">Login as Owner</button>
<table id="adminTable">
<thead>
<tr><th>Username</th><th>GCash</th><th>Amount ($)</th><th>₱</th><th>Date</th><th>Status</th><th>Action</th></tr>
</thead>
<tbody id="adminTableBody"></tbody>
</table>
</div>

<script>
const CONVERSION_RATE = 55;
const OWNER_PASSWORD = "Propetas6";

let username='';
let balance=0;
let topUsers={};
let withdrawals=[];

const balanceEl=document.getElementById('balance');
const leaderboardEl=document.getElementById('leaderboard');
const withdrawLeaderboardEl=document.getElementById('withdrawLeaderboard');
const adminDashboard=document.getElementById('adminDashboard');
const adminTableBody=document.getElementById('adminTableBody');
const cpmEl=document.getElementById('cpm');

// --- UI Helpers ---
function updateBalanceUI(){ balanceEl.textContent=balance.toFixed(2); }
function showConfetti(){ for(let i=0;i<20;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*window.innerWidth+'px'; c.style.background=`hsl(${Math.random()*360},100%,50%)`; document.body.appendChild(c); setTimeout(()=>c.remove(),1000); } }
function updateLeaderboardUI(){ leaderboardEl.innerHTML=''; Object.entries(topUsers).sort((a,b)=>b[1]-a[1]).forEach(([u,b])=>{ const li=document.createElement('li'); li.textContent=`${u} - $${b.toFixed(2)}`; leaderboardEl.appendChild(li); }); }
function updateWithdrawLeaderboardUI(){ withdrawLeaderboardEl.innerHTML=''; withdrawals.slice().reverse().forEach(w=>{ const li=document.createElement('li'); li.textContent=`${w.username} - ₱${w.peso.toFixed(2)} (${w.status})`; withdrawLeaderboardEl.appendChild(li); }); }
function updateAdminTable(){ adminTableBody.innerHTML=''; withdrawals.slice().reverse().forEach((w,i)=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${w.username}</td><td>${w.gcash}</td><td>$${w.usd}</td><td>₱${w.peso.toFixed(2)}</td><td>${w.date}</td><td>${w.status}</td>
<td><button onclick="approveRequest(${i})" ${w.status==='Approved'?'disabled':''}>Approve</button>
<button onclick="denyRequest(${i})" ${w.status==='Denied'?'disabled':''}>Deny</button></td>`; adminTableBody.appendChild(tr); }); }

// --- CPM Simulation ---
setInterval(()=>{ cpmEl.textContent=`Current CPM: $${(Math.random()*2+0.5).toFixed(2)}`; },5000);

// --- Set Username ---
document.getElementById('setUsernameBtn').onclick=()=>{
    const val=document.getElementById('usernameInput').value.trim();
    if(val.length<3){ alert("Username too short"); return; }
    username=val;
    if(!topUsers[username]) topUsers[username]=balance;
    updateLeaderboardUI();
    alert(`Username set: ${username}`);
};

// --- Ad Rooms ---
document.querySelectorAll('.adRoom').forEach(btn=>{
    btn.onclick=()=>{
        if(!username){ alert("Set username first!"); return; }
        const reward=parseFloat(btn.dataset.reward) + Math.random()*0.1;
        balance+=reward; topUsers[username]=balance;
        updateBalanceUI(); updateLeaderboardUI(); showConfetti();
    };
});

// --- Daily Bonus ---
document.getElementById('dailyBonusBtn').onclick=()=>{
    if(!username){ alert("Set username first!"); return; }
    const bonus=(Math.random()*0.5+0.5).toFixed(2);
    balance+=parseFloat(bonus); topUsers[username]=balance;
    updateBalanceUI(); updateLeaderboardUI(); showConfetti();
    alert(`Daily bonus: $${bonus}`);
};

// --- Withdraw Request ---
document.getElementById('withdrawBtn').onclick=()=>{
    if(!username){ alert("Set username first!"); return; }
    const gcash=document.getElementById('gcashNumber').value.trim();
    const usd=parseFloat(document.getElementById('withdrawAmount').value);
    if(!gcash || !usd || usd>balance){ alert("Invalid input or insufficient balance"); return; }
    const peso=usd*CONVERSION_RATE;
    withdrawals.push({username,gcash,usd,peso,status:"Pending",date:new Date().toLocaleString()});
    updateWithdrawLeaderboardUI(); updateAdminTable();
    alert(`Withdrawal requested: $${usd} (₱${peso.toFixed(2)})`);
};

// --- Admin Login ---
document.getElementById('adminLoginBtn').onclick=()=>{
    const pass=document.getElementById('adminPass').value;
    if(pass===OWNER_PASSWORD){ adminDashboard.style.display='block'; updateAdminTable(); alert("Owner access granted"); } else alert("Wrong password");
};

// --- Approve / Deny ---
function approveRequest(idx){
    const w=withdrawals[idx]; w.status="Approved"; balance-=w.usd; topUsers[w.username]=balance;
    updateBalanceUI(); updateWithdrawLeaderboardUI(); updateAdminTable();
    alert(`✅ Approved $${w.usd} to ${w.gcash}`);
}
function denyRequest(idx){
    withdrawals[idx].status="Denied"; updateWithdrawLeaderboardUI(); updateAdminTable();
    alert(`❌ Denied $${withdrawals[idx].usd} to ${withdrawals[idx].gcash}`);
}

// --- Initialize ---
updateBalanceUI(); updateLeaderboardUI(); updateWithdrawLeaderboardUI(); updateAdminTable();
</script>
</body>
</html>
