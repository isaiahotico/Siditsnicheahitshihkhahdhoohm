<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>INDIE WONDER ADS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag -->
<script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  text-align:center;
}
.card{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  margin:14px;
  padding:18px;
  border-radius:22px;
}
button{
  padding:14px 26px;
  border-radius:30px;
  border:none;
  background:linear-gradient(45deg,#00ffcc,#00ccff);
  font-size:16px;
  cursor:pointer;
}
input{
  padding:12px;
  width:90%;
  border-radius:16px;
  border:none;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
td,th{
  border:1px solid rgba(255,255,255,.2);
  padding:6px;
}
.hidden{display:none}
.status-pending{color:#ffcc00}
.status-approved{color:#00ff88}
.status-denied{color:#ff5555}
</style>
</head>

<body>

<h2>🌟 INDIE WONDER ADS</h2>

<div class="card">
  👤 <b id="user">Loading...</b>
</div>

<div class="card">
  💰 Balance
  <h2 id="usd">$0.00</h2>
  <div id="php">₱0.00</div>
</div>

<div class="card">
  <button onclick="watchAd()">▶ WATCH AD</button>
</div>

<div class="card">
  <h3>🏧 Withdraw (GCash)</h3>
  <input id="gcash" placeholder="GCash Number"><br><br>
  <input id="amount" placeholder="USD Amount"><br><br>
  <button onclick="withdraw()">REQUEST WITHDRAWAL</button>
</div>

<div class="card">
  <h3>📜 My Withdrawals</h3>
  <table id="userTable">
    <tr><th>USD</th><th>PHP</th><th>Status</th></tr>
  </table>
</div>

<div class="card">
  <small onclick="toggleAdmin()">⚙️ Admin</small>
</div>

<div id="adminLogin" class="card hidden">
  <input id="adminPass" type="password" placeholder="Admin Password"><br><br>
  <button onclick="adminLogin()">LOGIN</button>
</div>

<div id="adminPanel" class="card hidden">
  <h3>📋 Withdrawal Dashboard</h3>
  <table id="adminTable">
    <tr>
      <th>User</th>
      <th>USD</th>
      <th>PHP</th>
      <th>GCash</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </table>
</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://vuykmtapfjvxjdbixiad.supabase.co";
const SUPABASE_KEY = "sb_publishable_fRjfaQ2QgrTGkP5dQh95tA_8Ms1-5Qy";

const ADMIN_PASSWORD = "Propetas6";
const USD_TO_PHP = 56;

/* ================= INIT ================= */
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const tg = Telegram.WebApp;
tg.expand();

const tgUser = tg.initDataUnsafe.user;
const username = "telegram_" + tgUser.id;
document.getElementById("user").innerText = username;

/* ================= USER INIT ================= */
async function initUser(){
  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("username",username)
    .single();

  if(!data){
    await supabase.from("profiles").insert({username});
    updateBalance(0);
  }else{
    updateBalance(Number(data.balance));
  }

  loadUserWithdrawals();
}
initUser();

function updateBalance(usd){
  document.getElementById("usd").innerText = "$" + usd.toFixed(2);
  document.getElementById("php").innerText = "₱" + (usd * USD_TO_PHP).toFixed(2);
}

/* ================= ADS ================= */
async function watchAd(){
  show_10337795();
  await new Promise(r=>setTimeout(r,6000));

  const reward = 0.05;

  const { data } = await supabase
    .from("profiles")
    .select("balance")
    .eq("username",username)
    .single();

  const newBal = Number(data.balance) + reward;

  await supabase
    .from("profiles")
    .update({balance:newBal})
    .eq("username",username);

  updateBalance(newBal);
}

/* ================= WITHDRAW ================= */
async function withdraw(){
  const usd = Number(document.getElementById("amount").value);
  const gcash = document.getElementById("gcash").value;

  if(!gcash || usd <= 0){
    alert("Invalid withdrawal");
    return;
  }

  const { data } = await supabase
    .from("profiles")
    .select("balance")
    .eq("username",username)
    .single();

  if(usd > data.balance){
    alert("Insufficient balance");
    return;
  }

  const php = usd * USD_TO_PHP;

  await supabase.from("withdrawals").insert({
    username, usd, php, gcash, status:"pending"
  });

  await supabase
    .from("profiles")
    .update({balance:data.balance - usd})
    .eq("username",username);
}

/* ================= REALTIME USER ================= */
supabase.channel("user-sync")
  .on("postgres_changes",
    {event:"*",schema:"public",table:"withdrawals",filter:`username=eq.${username}`},
    () => loadUserWithdrawals()
  ).subscribe();

async function loadUserWithdrawals(){
  const { data } = await supabase
    .from("withdrawals")
    .select("*")
    .eq("username",username)
    .order("created_at",{ascending:false});

  const tbl = document.getElementById("userTable");
  tbl.innerHTML = "<tr><th>USD</th><th>PHP</th><th>Status</th></tr>";

  data.forEach(w=>{
    tbl.innerHTML += `
      <tr>
        <td>$${w.usd}</td>
        <td>₱${w.php}</td>
        <td class="status-${w.status}">${w.status}</td>
      </tr>`;
  });
}

/* ================= ADMIN ================= */
function toggleAdmin(){
  document.getElementById("adminLogin").classList.toggle("hidden");
}

function adminLogin(){
  if(document.getElementById("adminPass").value !== ADMIN_PASSWORD){
    alert("Wrong password");
    return;
  }
  document.getElementById("adminPanel").classList.remove("hidden");
  loadAdmin();
}

/* ================= REALTIME ADMIN ================= */
supabase.channel("admin-sync")
  .on("postgres_changes",
    {event:"*",schema:"public",table:"withdrawals"},
    () => loadAdmin()
  ).subscribe();

async function loadAdmin(){
  const { data } = await supabase
    .from("withdrawals")
    .select("*")
    .order("created_at",{ascending:false});

  const tbl = document.getElementById("adminTable");
  tbl.innerHTML = `
    <tr>
      <th>User</th><th>USD</th><th>PHP</th>
      <th>GCash</th><th>Status</th><th>Action</th>
    </tr>`;

  data.forEach(w=>{
    tbl.innerHTML += `
      <tr>
        <td>${w.username}</td>
        <td>$${w.usd}</td>
        <td>₱${w.php}</td>
        <td>${w.gcash}</td>
        <td class="status-${w.status}">${w.status}</td>
        <td>
          <button onclick="setStatus('${w.id}','approved')">✔</button>
          <button onclick="setStatus('${w.id}','denied')">✖</button>
        </td>
      </tr>`;
  });
}

async function setStatus(id,status){
  await supabase
    .from("withdrawals")
    .update({status})
    .eq("id",id);
}
</script>

</body>
</html>
