<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    
    <style>
        :root {
            --gold: #FFD700;
            --dark-gold: #B8860B;
            --shiny-gold: linear-gradient(135deg, #fceabb 0%, #fccd4d 50%, #f8b500 51%, #fbdf93 100%);
            --bg: #0b0b0b;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 70px;
            user-select: none;
        }

        /* Gold UI Elements */
        .gold-header {
            background: var(--shiny-gold);
            color: #000;
            padding: 20px;
            text-align: center;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            border-bottom: 2px solid var(--gold);
        }

        .balance-card {
            background: #1a1a1a;
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--gold);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .gold-text {
            color: var(--gold);
            font-weight: bold;
        }

        /* Main Menu */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .action-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 0.5px solid #333;
            transition: 0.3s;
        }

        .action-card:active { transform: scale(0.95); }

        .btn-gold {
            background: var(--shiny-gold);
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Chat System */

        #chat-room { height: 250px; overflow-y: auto; background: #000; padding: 10px; margin: 10px; border-radius: 10px; border: 1px solid #222; }
        .chat-msg { margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px; }
        .chat-user { color: var(--gold); font-weight: 600; margin-right: 5px; }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--dark-gold);
        }

        .nav-item { color: #888; font-size: 12px; text-align: center; flex: 1; }
        .nav-item.active { color: var(--gold); }

        /* Dashboard & Overlays */
        .screen { display: none; padding: 10px; animation: fadeIn 0.3s; }
        .active-screen { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .cooldown-text { font-size: 11px; color: #ff4444; margin-top: 5px; }
        
        input {
            background: #222; border: 1px solid var(--gold); color: white;
            padding: 10px; border-radius: 5px; width: 80%; margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="gold-header">
        <div id="tg-username">Loading...</div>
        <div style="font-size: 10px;">🎖🤑PAPERHOUSE INC ADS🤑🎖</div>
    </div>

    <div class="balance-card">
        <div>
            <div class="gold-text">POINTS</div>
            <div id="stat-points">0</div>
        </div>
        <div>
            <div class="gold-text">BALANCE</div>
            <div>₱<span id="stat-balance">0.00</span></div>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active-screen">
        <div class="grid-container">
            <div class="action-card">
                <span>Video Ads</span>
                <button class="btn-gold" id="btn-video" onclick="handleVideoAd()">WATCH</button>
                <div id="cd-video" class="cooldown-text"></div>
            </div>
            <div class="action-card">
                <span>Bonus Popup</span>
                <button class="btn-gold" id="btn-bonus" onclick="handleBonusAd()">CLAIM</button>
                <div id="cd-bonus" class="cooldown-text"></div>
            </div>
        </div>

        <div class="action-card" style="margin: 0 15px;">
            <h4 class="gold-text" style="margin:0 0 10px 0;">Referral System</h4>
            <p style="font-size: 12px;">Get 8% Bonus from your friends earnings!</p>
            <div id="referral-link" style="font-size: 11px; background: #000; padding: 5px; border: 1px dashed var(--gold);">Loading link...</div>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="screen-chat" class="screen">
        <div class="action-card">
            <h4 class="gold-text">Reward Chat Room</h4>
            <div id="chat-room"></div>
            <input type="text" id="chat-input" placeholder="Say something gold...">
            <button class="btn-gold" id="btn-chat" onclick="handleChatSend()">SEND (1 PT)</button>
            <div id="cd-chat" class="cooldown-text"></div>
        </div>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="screen-leaderboard" class="screen">
        <div class="action-card">
            <h4 class="gold-text">🏆 Top Daily Earners</h4>
            <div id="leader-list"></div>
        </div>
    </div>

    <!-- WALLET SCREEN -->
    <div id="screen-wallet" class="screen">
        <div class="action-card">
            <h4 class="gold-text">GCash Withdrawal</h4>

<p>Min/Max: ₱0.02</p>
            <input type="text" id="wd-gcash" placeholder="GCash Name">
            <input type="number" id="wd-number" placeholder="GCash Number">
            <button class="btn-gold" onclick="handleWithdraw()">WITHDRAW</button>
        </div>
        <div class="action-card" style="margin-top: 15px; font-size: 12px; text-align: left;">
            <h4 class="gold-text">History</h4>
            <div id="withdraw-history"></div>
        </div>
    </div>

    <!-- ADMIN SCREEN -->
    <div id="screen-admin" class="screen">
        <div id="admin-login-ui">
            <input type="password" id="admin-pass" placeholder="Admin Password">
            <button class="btn-gold" onclick="loginAdmin()">Login</button>
        </div>
        <div id="admin-panel" style="display: none;">
            <h3 class="gold-text">Owner Dashboard</h3>
            <div id="admin-pending-list"></div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="nav('home')">HOME</div>
        <div class="nav-item" onclick="nav('chat')">CHAT</div>
        <div class="nav-item" onclick="nav('leaderboard')">TOP</div>
        <div class="nav-item" onclick="nav('wallet')">WALLET</div>
        <div class="nav-item" onclick="nav('admin')">OWNER</div>
    </div>

    <!-- Firebase App (Modular) -->
    <script type="module" src="app.js"></script>
</body>
</html>
