<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: linear-gradient(135deg, #ffdf00 0%, #d4af37 50%, #f9d71c 100%);
            --glass: rgba(255, 255, 255, 0.07);
        }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .gold-text { background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .gold-border { border: 1px solid #d4af37; }
        .gold-btn { background: var(--gold); color: #000; font-weight: bold; transition: all 0.2s; border-radius: 12px; }
        .gold-btn:active { transform: scale(0.95); opacity: 0.8; }
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .cooldown { filter: grayscale(1); pointer-events: none; }
    </style>
</head>
<body class="p-0 m-0">

    <!-- LOGIN / GCASH OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-6">
        <div class="glass-card p-8 w-full max-w-sm text-center">
            <h1 class="text-2xl gold-text mb-2">WELCOME</h1>
            <p id="tg-welcome" class="text-gray-400 mb-6 font-bold text-lg">@Username</p>
            <input type="number" id="gcash-num" placeholder="Enter GCash Number" class="w-full bg-black border-b-2 border-yellow-600 p-3 mb-6 text-center text-white outline-none">
            <button onclick="saveGcash()" class="gold-btn w-full py-4 uppercase tracking-tighter">Enter Paperhouse</button>
        </div>
    </div>

    <!-- REFERRAL POPUP (Every Login) -->

    <div id="ref-modal" class="fixed inset-0 z-[60] bg-black/90 hidden flex items-center justify-center p-6">
        <div class="glass-card p-8 w-full max-w-sm text-center border-2 border-yellow-500">
            <h2 class="gold-text text-xl mb-2">REFERRAL CODE</h2>
            <p class="text-xs text-gray-400 mb-4 italic">Get 8% Bonus Auto-Credit to Inviter</p>
            <input type="text" id="ref-input" placeholder="Username of Inviter" class="w-full bg-zinc-900 border border-yellow-700 p-3 rounded-lg mb-4 text-white">
            <button onclick="applyRef()" class="gold-btn w-full py-3 mb-3">CLAIM BONUS & PROCEED</button>
            <button onclick="closeRef()" class="text-gray-500 text-sm underline">I don't have a code</button>
        </div>
    </div>

    <!-- MAIN UI -->
    <div id="main-app" class="hidden pb-24">
        <header class="p-4 glass-card m-2 flex justify-between items-center shadow-[0_0_15px_rgba(212,175,55,0.2)]">
            <div>
                <p class="text-[10px] text-yellow-500 font-bold uppercase">Total Balance</p>
                <h2 class="text-2xl font-black">₱ <span id="balance">0.000</span></h2>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-yellow-500 font-bold uppercase">Points</p>
                <h2 id="points" class="text-2xl font-black gold-text">0</h2>
            </div>
        </header>

        <main class="px-4">
            <!-- EARN -->
            <section id="tab-earn" class="tab-content active space-y-4">
                <div class="glass-card p-6 text-center mt-4">
                    <p class="text-xs text-gray-400 mb-1">Video Ad (Cooldown 1m)</p>
                    <button id="btn-video" onclick="watchVideo()" class="gold-btn px-12 py-4 shadow-lg shadow-yellow-600/20">WATCH VIDEO (+1pt)</button>
                    <p id="timer-video" class="text-red-500 text-xs mt-2"></p>
                </div>
                <div class="glass-card p-6 text-center">
                    <p class="text-xs text-gray-400 mb-1">Bonus Ad (Cooldown 45s)</p>
                    <button id="btn-bonus" onclick="watchBonus()" class="gold-btn px-12 py-4">BONUS POINT (+1pt)</button>
                    <p id="timer-bonus" class="text-red-500 text-xs mt-2"></p>
                </div>
            </section>

            <!-- CHAT -->
            <section id="tab-chat" class="tab-content">
                <div id="chat-display" class="glass-card h-[50vh] overflow-y-auto p-4 my-4 flex flex-col space-y-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-msg" placeholder="Message (Cost 1pt)..." class="flex-1 bg-zinc-900 border border-yellow-800 p-3 rounded-xl text-white">
                    <button id="btn-send" onclick="sendChat()" class="gold-btn px-6"><i class="fas fa-paper-plane"></i></button>
                </div>
                <p class="text-[10px] text-center mt-2 text-yellow-600 font-bold uppercase">Reward: ₱0.016 | CD: 92s</p>
                <p id="timer-chat" class="text-center text-red-500 text-xs"></p>
            </section>

            <!-- LEADERBOARD -->
            <section id="tab-top" class="tab-content">
                <h3 class="text-center gold-text mb-4 mt-4">DAILY TOP EARNERS</h3>
                <div id="top-list" class="space-y-2"></div>
            </section>

            <!-- WALLET -->
            <section id="tab-wallet" class="tab-content">
                <div class="glass-card p-8 text-center mt-4">
                    <h1 class="text-4xl gold-text mb-2 font-black">₱ <span id="wallet-bal">0.00</span></h1>
                    <p class="text-gray-500 text-xs mb-6 font-bold">MIN/MAX: ₱0.02</p>
                    <button onclick="requestWithdraw()" class="gold-btn w-full py-4 shadow-xl">WITHDRAW TO GCASH</button>
                </div>
                <h4 class="text-xs gold-text mt-6 mb-2 uppercase px-2">Recent Payouts</h4>
                <div id="payout-history" class="space-y-2"></div>
            </section>

            <!-- ADMIN -->
            <section id="tab-admin" class="tab-content">
                <div id="admin-payouts" class="space-y-2 mt-4"></div>
            </section>
        </main>

        <!-- NAV -->
        <nav class="fixed bottom-0 left-0 right-0 glass-card mx-2 mb-2 p-3 flex justify-around items-center z-40">
            <button onclick="nav('earn')" class="text-yellow-600"><i class="fas fa-bolt block text-xl"></i><span class="text-[10px]">Earn</span></button>
            <button onclick="nav('chat')" class="text-yellow-600"><i class="fas fa-comment-dots block text-xl"></i><span class="text-[10px]">Chat</span></button>
            <button onclick="nav('top')" class="text-yellow-600"><i class="fas fa-trophy block text-xl"></i><span class="text-[10px]">Top</span></button>
            <button onclick="nav('wallet')" class="text-yellow-600"><i class="fas fa-wallet block text-xl"></i><span class="text-[10px]">Wallet</span></button>
            <button onclick="checkAdmin()" class="text-yellow-600"><i class="fas fa-user-shield block text-xl"></i><span class="text-[10px]">Owner</span></button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
