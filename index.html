<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-shimmer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #3d3410 0%, #0a0a0a 100%); z-index: -2; }
        .diamond-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .diamond { position: absolute; width: 15px; height: 15px; background: gold; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); opacity: 0.3; animation: float 10s infinite linear; }
        @keyframes float { 0% { transform: translateY(110vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn.active { color: #fbbf24; border-top: 2px solid gold; }
        
        /* Reward Pop */
        #reward-pop { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; }
        
        table { width: 100%; font-size: 11px; text-align: left; border-collapse: collapse; }
        th { color: gold; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .pending { color: orange; font-weight: bold; }
        .approved { color: limegreen; font-weight: bold; }
        .rejected { color: red; font-weight: bold; }
    </style>
</head>
<body class="pb-24">
    <div class="bg-shimmer"></div>
    <div class="diamond-layer" id="diamonds"></div>

    <div id="reward-pop" class="glass p-8 rounded-3xl text-center border-2 border-yellow-500 shadow-2xl">
        <div class="text-6xl mb-4">💰</div>
        <h2 class="text-2xl font-black text-yellow-500">REWARD!</h2>
        <p id="pop-amt" class="text-xl font-bold mt-2"></p>
        <button onclick="closePop()" class="mt-6 bg-yellow-600 px-10 py-2 rounded-full font-bold">CLAIM</button>
    </div>

    <header class="p-4 glass sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xs font-black text-yellow-500">🎖 PAPERHOUSE INC</h1>
            <p class="text-[10px] opacity-60">@<span id="my-username">...</span></p>
        </div>
        <div class="text-right">
            <p class="text-green-400 font-black text-lg">₱<span id="balance">0.0000</span></p>
            <p class="text-blue-400 text-[10px] font-bold"><span id="pts">0</span> Chat Pts</p>
        </div>
    </header>

    <div class="p-4 space-y-4">
        <!-- ADS HOME -->
        <section id="home" class="tab-content active space-y-4">
            <div class="glass p-6 rounded-2xl text-center">
                <button onclick="runAd('normal')" id="btn-normal" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-700 py-4 rounded-xl font-black shadow-lg">WATCH AD (₱0.0102)</button>
                <p id="t-normal" class="text-[9px] mt-2 opacity-40">Cooldown: 3m</p>
            </div>
            <div class="glass p-6 rounded-2xl text-center border-purple-500/20">
                <button onclick="runAd('turbo')" id="btn-turbo" class="w-full bg-purple-600 py-4 rounded-xl font-black shadow-lg uppercase">Turbo Ads 🚀 (₱0.012)</button>
                <p id="t-turbo" class="text-[9px] mt-2 opacity-40">Cooldown: 45s</p>
            </div>
            <div class="glass p-6 rounded-2xl text-center border-blue-500/20">
                <button onclick="runAd('points')" id="btn-points" class="w-full bg-blue-600 py-4 rounded-xl font-black shadow-lg uppercase">Earn 1 Chat Pt ✨</button>
                <p id="t-points" class="text-[9px] mt-2 opacity-40">Cooldown: 5m</p>
            </div>
        </section>

        <!-- REFERRAL -->
        <section id="referral" class="tab-content space-y-4">
            <div class="glass p-6 rounded-2xl text-center" id="ref-setup">
                <h3 class="text-yellow-500 font-bold mb-2">Enter Referrer Username</h3>
                <input type="text" id="ref-input" placeholder="Referrer Username" class="w-full bg-white/5 p-3 rounded-lg mb-4 text-center border border-yellow-500/20">
                <button onclick="submitReferral()" class="w-full bg-yellow-600 py-3 rounded-xl font-bold">Submit Referrer</button>
            </div>
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between mb-4">
                    <span>Unclaimed Bonus (8%):</span>
                    <span class="text-green-400 font-bold">₱<span id="unclaimed-bal">0.00</span></span>
                </div>
                <button onclick="claimBonus()" class="w-full bg-green-600 py-3 rounded-xl font-bold">CLAIM TO BALANCE</button>
            </div>
        </section>

        <!-- WALLET -->
        <section id="wallet" class="tab-content space-y-4">
            <div class="glass p-6 rounded-2xl">
                <h3 class="text-yellow-500 font-bold mb-4">Withdraw GCash</h3>
                <input id="gcashName" placeholder="GCash Full Name" class="w-full bg-white/5 p-3 rounded-lg mb-2 text-xs border border-white/10">
                <input id="gcashNumber" placeholder="GCash Number" class="w-full bg-white/5 p-3 rounded-lg mb-2 te

xt-xs border border-white/10">
                <input id="withdrawAmount" placeholder="Amount" type="number" class="w-full bg-white/5 p-3 rounded-lg mb-4 text-xs border border-white/10">
                <button onclick="requestWithdraw()" class="w-full bg-green-600 py-3 rounded-xl font-bold">💸 Request Withdrawal</button>
            </div>
            <div class="glass rounded-2xl overflow-x-auto">
                <table>
                    <thead><tr><th>Date</th><th>GCash</th><th>Amount</th><th>Status</th></tr></thead>
                    <tbody id="withdrawTable"></tbody>
                </table>
            </div>
        </section>

        <!-- ADMIN -->
        <section id="admin" class="tab-content space-y-4">
            <div id="admin-gate" class="glass p-6 rounded-2xl">
                <input id="adminPass" type="password" placeholder="Admin Password" class="w-full bg-white/5 p-3 rounded-lg mb-4 border border-red-500/30">
                <button onclick="openAdmin()" class="w-full bg-red-600 py-3 rounded-xl font-bold">Access Dashboard</button>
            </div>
            <div id="adminPanel" class="hidden space-y-4">
                <h3 class="text-xs font-bold text-yellow-500 uppercase mb-2">Withdrawal Requests</h3>
                <div class="glass rounded-xl overflow-x-auto">
                    <table>
                        <thead><tr><th>User</th><th>GCash</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="adminWithdrawTable"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 glass h-20 flex justify-around items-center z-[100] border-t border-yellow-500/20">
        <button onclick="tab('home')" id="n-home" class="nav-btn p-2 flex flex-col items-center active"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></button>
        <button onclick="tab('referral')" id="n-referral" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-users"></i><span class="text-[10px]">Referral</span></button>
        <button onclick="tab('wallet')" id="n-wallet" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[10px]">Wallet</span></button>
        <button onclick="tab('admin')" id="n-admin" class="nav-btn p-2 flex flex-col items-center"><i class="fas fa-user-shield"></i><span class="text-[10px]">Admin</span></button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
