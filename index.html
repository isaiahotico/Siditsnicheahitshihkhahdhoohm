<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>

    <style>
        :root {
            --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --dark-gold: #8a6d3b;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }
        .gold-text {
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', sans-serif;
        }
        .gold-btn {
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.1s;
        }
        .gold-btn:active { transform: scale(0.95); }
        .gold-border { border: 1px solid #bf953f; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(191, 149, 63, 0.2);
        }
        .hidden { display: none; }
        .shining { animation: shine 1.5s infinite; }
        @keyframes shine { 0% { opacity: 0.8; } 50% { opacity: 1; filter: brightness(1.3); } 100% { opacity: 0.8; } }
        #chat-messages { height: 40vh; overflow-y: auto; scroll-behavior: smooth; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-3xl font-bold gold-text mb-2 shining">PAPERHOUSE INC</h1>
        <p class="text-xs text-yellow-600 mb-8 tracking-widest uppercase">The Gold Standard of Rewards</p>
        
        <div class="glass p-6 rounded-2xl w-full max-w-sm space-y-4">
            <input id="reg-user" type="text" placeholder="Username" class="w-full bg-black border-b border-yellow-700 p-3 outline-none text-white">

            <input id="reg-gcash" type="number" placeholder="GCash Number" class="w-full bg-black border-b border-yellow-700 p-3 outline-none text-white">
            <input id="reg-ref" type="text" placeholder="Referral Username (Optional)" class="w-full bg-black border-b border-yellow-700 p-3 outline-none text-white">
            <button onclick="authAction()" class="gold-btn w-full py-4 uppercase tracking-tighter">Enter House Immediately</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-main" class="hidden">
        <!-- Header -->
        <header class="p-4 glass sticky top-0 z-50 flex justify-between items-center border-b border-yellow-900">
            <div>
                <p class="text-[10px] uppercase text-gray-400">Your Balance</p>
                <p class="text-xl font-bold gold-text">₱<span id="bal">0.000</span></p>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase text-gray-400">Chat Points</p>
                <p class="text-xl font-bold text-yellow-500"><span id="pts">0</span> CP</p>
            </div>
        </header>

        <div class="p-4 space-y-6 pb-24">
            <!-- Ads Section -->
            <div class="grid grid-cols-2 gap-3">
                <div class="glass p-4 rounded-xl text-center">
                    <p class="text-xs mb-2">Rewarded Video</p>
                    <button id="v-btn" onclick="playVideoAd()" class="gold-btn w-full py-2 text-sm">Get 1 CP</button>
                    <p id="v-timer" class="text-[10px] mt-1 text-gray-500">Ready</p>
                </div>
                <div class="glass p-4 rounded-xl text-center">
                    <p class="text-xs mb-2">Bonus Popup</p>
                    <button id="b-btn" onclick="playBonusAd()" class="gold-btn w-full py-2 text-sm">Get 1 CP</button>
                    <p id="b-timer" class="text-[10px] mt-1 text-gray-500">Ready</p>
                </div>
            </div>

            <!-- Chat Room -->
            <div class="glass rounded-xl p-3">
                <h3 class="gold-text text-sm font-bold mb-2">🏆 GLOBAL CHAT (Earn ₱0.016)</h3>
                <div id="chat-messages" class="text-sm space-y-2 mb-3"></div>
                <div class="flex gap-2">
                    <input id="msg-input" type="text" placeholder="Message (1 CP)..." class="flex-1 bg-black border border-yellow-900 rounded-lg p-2 text-sm outline-none">
                    <button id="send-btn" onclick="handleChat()" class="gold-btn px-4 py-2">Send</button>
                </div>
                <p id="c-timer" class="text-[10px] text-center mt-2 text-gray-500">92s Cooldown</p>
            </div>

            <!-- Leaderboard -->
            <div class="glass rounded-xl p-4">
                <h3 class="gold-text text-center font-bold mb-4">DAILY TOP EARNERS</h3>
                <div id="leaderboard" class="space-y-2 text-sm"></div>
            </div>

            <!-- Withdraw -->
            <div class="glass rounded-xl p-4 text-center">
                <p class="text-xs mb-1">Fixed Withdrawal</p>
                <h4 class="text-xl font-bold mb-3">₱0.02</h4>
                <button onclick="requestWithdraw()" class="gold-btn w-full py-3">Withdraw to GCash</button>
                <div id="withdraw-list" class="mt-4 text-left text-[10px] space-y-1 opacity-70"></div>
            </div>
        </div>

        <!-- Footer / Admin Access -->
        <footer class="p-8 text-center opacity-30">
            <button onclick="openAdmin()" class="text-xs">Owner Dashboard</button>
        </footer>
    </div>

    <!-- Admin Modal -->
    <div id="admin-panel" class="fixed inset-0 bg-black z-[100] hidden p-6 overflow-y-auto">
        <button onclick="this.parentElement.classList.add('hidden')" class="text-red-500 mb-4">Close</button>
        <h2 class="gold-text text-2xl mb-4">Payout Dashboard</h2>
        <div id="admin-data" class="space-y-3"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
