<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdsGram Random Ad Demo</title>
    <!-- AdsGram SDK -->
    <script src="https://ads.gram/sdk.js"></script> <!-- Replace with your actual SDK URL -->
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #eef2f7;
        }
        button {
            padding: 14px 24px;
            margin: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: 0.2s;
        }
        button:hover {
            background: #006ae6;
        }
    </style>
</head>
<body>
    <h2>AdsGram Random Ad Demo</h2>
    <button id="rollAdButton">Roll Ad</button>

    <script>
        // Function to show AdsGram Task 21469
        function showAdsTask21469() {
            if (typeof AdsGram !== "undefined" && AdsGram.showTask) {
                AdsGram.showTask(21469);
                console.log("AdsGram Task 21469 displayed");
            } else {
                console.warn("AdsGram SDK not loaded or showTask function missing");
            }
        }

        // Function to show Interstitial Ad 21422
        function showInterstitial21422() {
            if (typeof AdsGram !== "undefined" && AdsGram.showInterstitial) {
                AdsGram.showInterstitial(21422);
                console.log("Interstitial Ad 21422 displayed");
            } else {
                console.warn("AdsGram SDK not loaded or showInterstitial function missing");
            }
        }

        // Function to randomly choose which ad to show
        function rollAd() {
            const random = Math.random(); // 0 to 1
            if (random < 0.5) {
                showAdsTask21469();       // 50% chance
            } else {
                showInterstitial21422();  // 50% chance
            }
        }

        // Add event listener to the Roll Ad button
        document.getElementById("rollAdButton").addEventListener("click", rollAd);
    </script>
</body>
</html>
