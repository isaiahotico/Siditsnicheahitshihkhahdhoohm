<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Login (Merged)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js'
        data-zone='10337795'
        data-sdk='show_10337795'></script>

<style>
body{
  background:#0e1220;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
}
#dailyBtn{
  width:190px;
  height:65px;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  border:none;
  border-radius:15px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
}
#dailyBtn:disabled{
  background:#444;
  cursor:not-allowed;
}
#cooldown{
  font-size:12px;
  opacity:.9;
  margin-top:4px;
}
</style>
</head>

<body>

<button id="dailyBtn">
  🎁 Daily Login
  <div id="cooldown">Ready</div>
</button>

<script>
const COOLDOWN = 15 * 60 * 1000; // 15 minutes
const KEY = "daily_login_merged";

const btn = document.getElementById("dailyBtn");
const cd  = document.getElementById("cooldown");

function updateCooldown(){
  const last = localStorage.getItem(KEY);
  if(!last){
    btn.disabled = false;
    cd.textContent = "Ready";
    return;
  }
  const diff = Date.now() - last;
  if(diff >= COOLDOWN){
    btn.disabled = false;
    cd.textContent = "Ready";
  } else {
    btn.disabled = true;
    const r = COOLDOWN - diff;
    const m = Math.floor(r/60000);
    const s = Math.floor((r%60000)/1000);
    cd.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }
}

setInterval(updateCooldown, 1000);
updateCooldown();

async function showRewarded(){
  // Rewarded Interstitial (primary)
  await show_10337795();
  // ✅ reward only if completed
  alert("✅ Reward granted!");
}

function showInAppFallback(){
  // In-App Interstitial (fallback)
  show_10337795({
    type: 'inApp',
    inAppSettings: {
      frequency: 2,
      capping: 0.1,
      interval: 30,
      timeout: 5,
      everyPage: false
    }
  });
}

btn.onclick = async () => {
  btn.disabled = true;
  cd.textContent = "Loading ad...";

  try {
    await showRewarded();        // try rewarded first
    localStorage.setItem(KEY, Date.now());
  } catch (e) {
    // If rewarded fails, show in-app interstitial (no reward)
    showInAppFallback();
    alert("ℹ️ Ad shown (no reward)");
    localStorage.setItem(KEY, Date.now());
  }

  updateCooldown();
};
</script>

</body>
</html>
