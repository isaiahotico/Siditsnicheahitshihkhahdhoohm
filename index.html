<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GLOBAL REWARDS INDIE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src='//libtl.com/sdk.js' data-zone='10337795'></script>

<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-family:Comic Sans MS;text-align:center;padding:15px}
button{padding:12px 20px;border:none;border-radius:18px;background:#ffec61;margin:6px}
input{padding:10px;border-radius:10px;border:none;margin:4px}
.box{background:#fff;color:#000;border-radius:12px;padding:10px;margin:10px auto;max-width:400px}
</style>
</head>

<body>
<h2>🌍 GLOBAL REWARDS INDIE</h2>
<h3>Wallet: $<span id="balance">0.00</span></h3>

<button onclick="watchAd()">▶ Watch Ad</button>

<h3>Withdraw</h3>
<input id="gcash" placeholder="GCash Number">
<input id="amount" type="number" placeholder="USD">
<button onclick="withdraw()">Request</button>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_PUBLIC_ANON_KEY";
const supabase = supabaseJs.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ================= TELEGRAM ================= */
const tg = Telegram.WebApp;
tg.expand();
const user = tg.initDataUnsafe.user;
const username = "telegram_" + user.id;

/* ================= INIT ================= */
async function init(){
  let {data} = await supabase
    .from("profiles")
    .select("*")
    .eq("username",username)
    .single();

  if(!data){
    await supabase.from("profiles").insert({username,balance:0});
  }
  loadBalance();
}
init();

/* ================= BALANCE ================= */
async function loadBalance(){
  const {data} = await supabase
    .from("profiles")
    .select("balance")
    .eq("username",username)
    .single();
  balance.textContent = Number(data.balance).toFixed(2);
}

/* ================= ADS ================= */
function watchAd(){
  show_10337795().then(async ()=>{
    const earn = Math.random()*0.3+0.1;
    await supabase.rpc("credit_balance",{
      username_input:username,
      amount_input:earn
    });
    loadBalance();
  });
}

/* ================= WITHDRAW ================= */
async function withdraw(){
  const amt = Number(amount.value);
  if(amt<=0) return alert("Invalid amount");

  const {data:userRow} = await supabase
    .from("profiles").select("id").eq("username",username).single();

  await supabase.from("withdrawals").insert({
    user_id:userRow.id,
    amount:amt,
    method:"gcash",
    account_info:gcash.value
  });

  alert("Withdrawal Requested");
}
</script>
</body>
</html>
