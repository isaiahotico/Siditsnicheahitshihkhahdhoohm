<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Watch-to-Watch | Premium Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff0000;
            --bg: #0f0f0f;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #3ea6ff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 15px 5%;
            background: rgba(15, 15, 15, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        #tg-username { color: var(--accent); font-weight: bold; }

        .container {
            width: 95%;
            max-width: 1000px;
            margin-top: 20px;
            text-align: center;
        }

        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-next { background: var(--primary); color: white; font-size: 1.1em; }
        .btn-next:hover { transform: scale(1.05); background: #cc0000; }

        .input-section {
            background: var(--card-bg);

            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        input {
            width: 70%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
        }

        .my-links {
            text-align: left;
            margin-top: 30px;
        }

        .link-item {
            background: #2a2a2a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        #login-container { margin: 20px; }
    </style>

    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
</head>
<body>

    <header>
        <div class="logo"><i class="fab fa-youtube" style="color:red"></i> Watch2Watch</div>
        <div class="user-info">
            <span id="tg-username">Guest User</span>
            <div id="login-container">
                <!-- Telegram Login Widget -->
                <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="YOUR_BOT_USERNAME" 
                    data-size="small" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write"></script>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Player -->
        <div class="player-container">
            <div id="player-placeholder" style="color: #666; padding-top: 20%;">
                <i class="fas fa-play-circle fa-5x"></i>
                <p>Click NEXT to start watching</p>
            </div>
            <div id="youtube-frame-wrapper"></div>
        </div>

        <div class="controls">
            <button class="btn-next" onclick="handleNextVideo()">
                <i class="fas fa-forward"></i> NEXT RANDOM VIDEO
            </button>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <h3>Add Your YouTube Video</h3>
            <input type="text" id="video-url" placeholder="Paste YouTube Link (e.g., https://youtu.be/...)">
            <button onclick="submitVideo()" style="background: var(--accent); color: white;">SUBMIT</button>
        </div>

        <!-- Profile / My History -->
        <div class="my-links">
            <h3><i class="fas fa-history"></i> My Submitted Links</h3>
            <div id="links-list">
                <!-- Links will appear here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>

    <script>
        // Callback for Telegram
        function onTelegramAuth(user) {
            localStorage.setItem('tg_user', JSON.stringify(user));
            document.getElementById('tg-username').innerText = "@" + user.username;
            document.getElementById('login-container').style.display = 'none';
            // Trigger event for app.js
            window.dispatchEvent(new Event('userLogin'));
        }
    </script>
</body>
</html>
