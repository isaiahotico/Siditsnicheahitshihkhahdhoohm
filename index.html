<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinoyRewards - Earn GCash</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .gcash-blue { background-color: #007dfe; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="gcash-blue text-white p-6 rounded-3xl shadow-lg mb-6">
            <p class="text-sm opacity-80">Available Balance</p>
            <h1 class="text-4xl font-bold">₱ <span id="balance">0.00</span></h1>
        </div>

        <!-- Earning Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-4 border border-blue-100">
            <h2 class="font-bold text-gray-800 mb-2">Daily Tasks</h2>
            <p class="text-gray-500 text-sm mb-4">Watch a short video to earn ₱0.50 per ad.</p>
            
            <button id="watchAdBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2">
                <span>📺</span> Watch Ads & Earn
            </button>
        </div>

        <!-- Withdrawal Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100">
            <h2 class="font-bold text-gray-800 mb-4">GCash Withdrawal</h2>
            <input type="number" id="gcashNumber" placeholder="GCash Number (09...)" class="w-full p-3 border rounded-lg mb-3 outline-none focus:ring-2 focus:ring-blue-500">
            <button id="withdrawBtn" class="w-full gcash-blue text-white font-bold py-3 rounded-xl opacity-50 cursor-not-allowed" disabled>
                Withdraw to GCash
            </button>
            <p id="statusMsg" class="text-xs mt-3 text-center text-gray-500 font-medium"></p>
        </div>

        <!-- Info -->
        <p class="text-center text-gray-400 text-xs mt-8">Minimum withdrawal: ₱50.00</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
