<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎖🤑PAPERHOUSE INC ADS🤑🎖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>

    <style>
        :root {
            --charcoal: #36454f;
            --gold-armor: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --lagoon: linear-gradient(180deg, #00B4DB 0%, #0083B0 100%);
        }
        
        body { 
            color: var(--charcoal); 
            font-weight: 900; /* Thick Text */
            overflow: hidden;
            height: 100vh;
        }

        #bg-layer {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1;
            transition: all 0.8s ease-in-out;
        }

        .gold-armor { background: var(--gold-armor); background-size: 400% 400%; animation: shine 3s infinite; }
        .lagoon-bg { background: var(--lagoon); }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px); border: 2px solid rgba(255,255,255,0.3); }
        .tab-content { display: none; height: 72vh; overflow-y: auto; }
        .active-tab { display: block; }
        
        input { font-weight: 900; color: var(--charcoal); }
    </style>
</head>
<body>

    <div id="bg-layer" class="gold-armor"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6">
        <h1 class="text-3xl mb-6 text-center">🎖 PAPERHOUSE INC ADS 🎖</h1>
        <input type="text" id="username" placeholder="Enter Nickname" class="w-full p-4 rounded-xl border-4 border-[#36454f] mb-4 text-center">
        <button onclick="app.login()" class="w-full bg-[#36454f] text-white p-4 rounded-xl text-xl">ENTER APP</button>
    </div>

    <!-- Main App -->

    <div id="main-ui" class="hidden h-screen flex flex-col">
        
        <!-- Top Bar -->
        <div class="p-4 flex justify-between items-center glass m-2 rounded-2xl">
            <div>
                <p class="text-xs uppercase">Your Balance</p>
                <p class="text-2xl font-black">₱ <span id="balance">0.0000</span></p>
            </div>
            <div class="text-right">
                <p class="text-xs uppercase">Status</p>
                <p class="text-green-800">ONLINE</p>
            </div>
        </div>

        <!-- Content Area -->
        <main class="flex-1 px-4">
            
            <!-- Home: Ad Center -->
            <div id="tab-home" class="tab-content active-tab text-center">
                <div class="mt-10">
                    <button onclick="app.watchMainAd()" class="w-56 h-56 rounded-full bg-white/40 border-8 border-[#36454f] shadow-2xl transition-transform active:scale-90">
                        <i class="fas fa-play-circle text-6xl mb-2"></i><br>
                        EARN ₱0.0065
                    </button>
                    <p class="mt-4 bg-white/30 rounded-full py-1 px-4 inline-block">Ads are ready!</p>
                </div>
            </div>

            <!-- Chat Room -->
            <div id="tab-chat" class="tab-content">
                <div class="h-full flex flex-col">
                    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 p-2"></div>
                    <div class="flex gap-2 p-2 glass rounded-xl mt-2">
                        <input type="text" id="chat-input" class="flex-1 bg-transparent outline-none" placeholder="Type message...">
                        <button onclick="app.sendMessage()" class="text-2xl"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- Rank / Leaderboard -->
            <div id="tab-rank" class="tab-content">
                <h2 class="text-center text-xl mb-4">🏆 GLOBAL RANKING</h2>
                <div id="leaderboard" class="space-y-2"></div>
            </div>

            <!-- Wallet / Withdraw -->
            <div id="tab-wallet" class="tab-content">
                <div class="glass p-4 rounded-2xl mb-4">
                    <h3 class="mb-2">WITHDRAW GCASH</h3>
                    <input type="number" id="gcash-num" placeholder="GCash Number" class="w-full p-2 mb-2 rounded bg-white/50">
                    <input type="number" id="withdraw-amount" placeholder="Amount (Min 0.02)" class="w-full p-2 mb-2 rounded bg-white/50">
                    <button onclick="app.requestWithdraw()" class="w-full bg-[#36454f] text-white py-3 rounded-xl">SUBMIT REQUEST</button>
                </div>
                <h3 class="mb-2 px-2 uppercase text-xs">Transaction History</h3>
                <div id="history-list" class="space-y-2"></div>
            </div>

            <!-- Admin -->
            <div id="tab-admin" class="tab-content">
                <div id="admin-lock">
                    <input type="password" id="admin-pass" placeholder="Admin Key" class="w-full p-4 border-4 border-[#36454f] rounded-xl mb-4 mt-10">
                    <button onclick="app.unlockAdmin()" class="w-full bg-red-600 text-white p-4 rounded-xl">LOGIN ADMIN</button>
                </div>
                <div id="admin-panel" class="hidden">
                    <h2 class="text-center text-xl mb-4">PENDING PAYMENTS</h2>
                    <div id="admin-pending-list" class="space-y-2 text-xs"></div>
                </div>
            </div>

        </main>

        <!-- Footer Nav -->
        <nav cl

ass="flex justify-around items-center p-4 glass m-2 rounded-2xl">
            <button onclick="app.switchTab('home')" class="text-2xl"><i class="fas fa-coins"></i></button>
            <button onclick="app.switchTab('chat')" class="text-2xl"><i class="fas fa-comments"></i></button>
            <button onclick="app.switchTab('rank')" class="text-2xl"><i class="fas fa-trophy"></i></button>
            <button onclick="app.switchTab('wallet')" class="text-2xl"><i class="fas fa-wallet"></i></button>
            <button onclick="app.switchTab('admin')" class="text-xl opacity-30"><i class="fas fa-user-shield"></i></button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
