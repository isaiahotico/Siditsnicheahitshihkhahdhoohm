<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeGcashads - Watch & Earn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-500">FreeGcashads</h1>
            <div id="userInfo" class="flex items-center gap-4">
                <div class="text-right">
                    <p id="tgHandle" class="text-blue-400 font-mono text-sm">@Loading...</p>
                    <p class="text-green-400 font-bold">₱<span id="userBalance">0.00</span></p>
                </div>
                <button id="loginBtn" class="bg-red-600 px-4 py-2 rounded text-sm">Login with Google</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <!-- Submit Section -->
        <section class="bg-gray-800 p-6 rounded-lg mb-8 border border-gray-700">
            <h2 class="text-lg font-semibold mb-4 text-gray-300">Promote Your Video</h2>
            <div class="flex flex-col gap-3">
                <input id="ytLinkInput" type="text" placeholder="Paste YouTube Link (e.g., https://youtu.be/...)" class="bg-gray-700 border border-gray-600 p-3 rounded w-full focus:outline-none focus:border-red-500">
                <div class="flex flex-wrap gap-2 text-xs">
                    <span id="freeLinkBadge" class="bg-green-900 text-green-300 px-2 py-1 rounded">5 Free Slots Left</span>
                    <span class="bg-blue-900 text-blue-300 px-2 py-1 rounded">Premium: ₱5.00 for 550 views</span>
                </div>
                <button id="addLinkBtn" class="bg-blue-600 hover:bg-blue-700 transition w-full py-3 rounded font-bold">Add Link to Queue</button>
            </div>
        </section>

        <!-- Queue Section -->
        <section>
            <h2 class="text-xl font-bold mb-4">Watch & Earn (₱0.01 per 30s)</h2>
            <div id="videoQueue" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Links will be injected here -->
                <p class="text-gray-500 italic">No videos in queue...</p>
            </div>
        </section>
    </main>

    <!-- Video Player Modal -->
    <div id="videoModal" class="modal items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 w-full max-w-2xl rounded-lg overflow-hidden relative">
            <div class="p-4 flex justify-between items-center border-b border-gray-800">
                <span id="timerDisplay" class="text-xl font-mono font-bold text-yellow-500">Wait: 30s</span>
                <span class="text-sm text-gray-400">Do not close this window</span>
            </div>
            <div class="aspect-video bg-black">
                <div id="player"></div>
            </div>
            <div class="p-4 text-center">
                <p class="text-sm text-gray-500 italic">Link will redirect to YouTube automatically after 30 seconds.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
</body>
</html>
