<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeCoin Pro - Watch & Earn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Segoe UI', sans-serif; }
        .nav-link { color: #aaa; cursor: pointer; }
        .nav-link.active { color: #ff0000 !important; font-weight: bold; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; }
        #player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
        .coin-badge { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; font-weight: bold; padding: 5px 15px; border-radius: 20px; }
        .live-item { border-left: 3px solid #ff0000; padding-left: 10px; margin-bottom: 8px; font-size: 0.85rem; }
        .hidden { display: none; }
        .admin-row { font-size: 0.8rem; border-bottom: 1px solid #333; padding: 10px 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#" onclick="showSection('watch')">TUBE<span class="text-danger">COIN</span></a>
        <div class="d-flex gap-3">
            <a class="nav-link active" id="nav-watch" onclick="showSection('watch')">Watch</a>
            <a class="nav-link" id="nav-leader" onclick="showSection('leader')">Leaderboard</a>
            <a class="nav-link" id="nav-withdraw" onclick="showSection('withdraw')">Withdraw</a>
            <a class="nav-link text-warning" onclick="accessAdmin()">Admin</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- WATCH SECTION -->
    <div id="section-watch">
        <div class="row">
            <div class="col-md-8">
                <div class="card p-2">
                    <div id="player-container"><div id="player"></div></div>
                    <div class="p-3 d-flex justify-content-between">
                        <div>
                            <h5 id="video-title">Loading video...</h5>
                            <div id="timer-display" class="text-info fw-bold">00:00</div>
                        </div>

                        <div class="text-end">
                            <span class="coin-badge">💰 <span id="balance">0</span></span>
                            <div class="small text-muted mt-1">1 Coin = ₱0.0075</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h6>Submit Video</h6>
                    <input type="text" id="video-url" class="form-control form-control-sm mb-2 bg-dark text-white" placeholder="YouTube URL">
                    <button onclick="submitVideo()" class="btn btn-danger btn-sm w-100">Add Link (5 Free)</button>
                </div>
                <div class="card p-3" style="height: 300px; overflow-y: auto;">
                    <h6>Live Activity</h6>
                    <div id="live-feed"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- LEADERBOARD SECTION -->
    <div id="section-leader" class="hidden">
        <div class="card p-4">
            <h3 class="text-center mb-4">Weekly Top Viewers</h3>
            <table class="table table-dark table-striped">
                <thead><tr><th>Rank</th><th>Username</th><th>Weekly Views</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <!-- WITHDRAW SECTION -->
    <div id="section-withdraw" class="hidden">
        <div class="row">
            <div class="col-md-5">
                <div class="card p-4">
                    <h3>Withdraw GCash</h3>
                    <p class="text-muted small">Min: ₱1.00 (134 Coins)</p>
                    <input type="text" id="withdraw-name" class="form-control mb-2 bg-dark text-white" placeholder="Account Name">
                    <input type="number" id="withdraw-number" class="form-control mb-2 bg-dark text-white" placeholder="GCash Number">
                    <input type="number" id="withdraw-coins" class="form-control mb-3 bg-dark text-white" placeholder="Coins to Convert">
                    <button onclick="requestWithdraw()" class="btn btn-success w-100">Submit Request</button>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card p-4">
                    <h3>History</h3>
                    <div id="withdraw-history" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ADMIN SECTION -->
    <div id="section-admin" class="hidden">
        <div class="card p-4">
            <div class="d-flex justify-content-between">
                <h3>Admin Panel (Withdrawals)</h3>
                <button class="btn btn-sm btn-outline-danger" onclick="showSection('watch')">Exit</button>
            </div>
            <hr>
            <div id="admin-list"></div>
        </div>
    </div>
</div>

<script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
<script type="module" src="app.js"></script>
</body>
</html>
