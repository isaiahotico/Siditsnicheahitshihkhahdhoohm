<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold YT Watch & Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c); --bg-cyan: linear-gradient(45deg, #00f2fe, #4facfe, #00c6ff, #0072ff); }
        body { transition: background 0.5s ease; min-height: 100vh; font-family: sans-serif; }
        .bg-shining-gold { background: var(--bg-gold); background-size: 400% 400%; animation: shine 10s infinite; }
        .bg-shining-cyan { background: var(--bg-cyan); background-size: 400% 400%; animation: shine 10s infinite; }
        @keyframes shine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 15px; }
        .hidden-tab { display: none; }
    </style>
</head>
<body class="bg-shining-gold p-4" id="body-bg" onclick="changeTheme()">
    
    <!-- Top Bar -->
    <div class="glass p-3 mb-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div id="u-photo" class="w-10 h-10 rounded-full bg-white flex items-center justify-center font-bold text-yellow-700">?</div>
            <div>
                <p id="u-name" class="text-sm font-bold text-gray-800">Loading...</p>
                <p class="text-[10px] text-gray-600 uppercase tracking-tighter">Online Users: <span id="online-count">0</span></p>
            </div>
        </div>
        <div class="bg-yellow-100 px-3 py-1 rounded-full border border-yellow-400 flex items-center gap-2">
            <i class="fas fa-coins text-yellow-600"></i>
            <span id="coin-balance" class="font-bold text-yellow-800 text-lg">0</span>
        </div>
    </div>

    <!-- Main Player Tab -->
    <div id="tab-home" class="tab-content">
        <div class="glass p-2 mb-4 overflow-hidden shadow-xl">
            <div id="player"></div>
        </div>        <div class="flex gap-2 mb-4">
            <button onclick="playVideo()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg"><i class="fas fa-play mr-2"></i>Play & Earn</button>
            <button onclick="playNextRandom()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg">Next <i class="fas fa-random ml-2"></i></button>
        </div>

        <div class="glass p-4 mb-4">
            <input type="text" id="video-url" placeholder="YouTube URL (50 coins after 5 free)" class="w-full p-3 rounded-lg bg-white/50 border-none mb-2 focus:ring-2 ring-yellow-500">
            <button onclick="addVideo()" class="w-full py-2 bg-yellow-700 text-white rounded-lg font-bold">Add to Watch List</button>
        </div>
    </div>

    <!-- Profile/Withdraw Tab -->
    <div id="tab-profile" class="tab-content hidden-tab space-y-4">
        <div class="glass p-4">
            <h3 class="font-bold border-b pb-2 mb-2">My Stats</h3>
            <p>Total Watched: <span id="total-watched">0</span> videos</p>
            <p>Invites: <span id="total-invites">0</span> users</p>
            <p>Referral Earned: <span id="referral-earned">0</span> coins</p>
        </div>
        <div class="glass p-4">
            <h3 class="font-bold border-b pb-2 mb-2">Withdraw to GCash</h3>
            <p class="text-xs text-gray-700 mb-2">1 Coin = 0.0030 PHP (Min: 1 PHP)</p>
            <input type="number" id="withdraw-amount" placeholder="Coins to withdraw" class="w-full p-2 rounded bg-white/50 mb-2">
            <button onclick="requestWithdrawal()" class="w-full bg-black text-white py-2 rounded">Withdraw Now</button>
        </div>
    </div>

    <!-- Leaderboard Tab -->
    <div id="tab-leader" class="tab-content hidden-tab glass p-4">
        <h3 class="font-bold text-center mb-4">Top Earners</h3>
        <div id="leaderboard-list" class="space-y-2"></div>
    </div>

    <!-- Admin Tab (Visible only to Admin) -->
    <div id="tab-admin" class="tab-content hidden-tab glass p-4">
        <h3 class="font-bold text-red-700 border-b pb-2 mb-2 text-center">Admin Panel</h3>
        <div id="admin-requests" class="space-y-3 text-sm"></div>
    </div>

    <!-- Footer Navigation -->
    <div class="fixed bottom-0 left-0 w-full glass p-2 flex justify-around items-center rounded-none rounded-t-3xl border-t-2 border-yellow-300">
        <button onclick="switchTab('home')" class="p-2 flex flex-col items-center"><i class="fas fa-play"></i><span class="text-[10px]">Watch</span></button>
        <button onclick="switchTab('profile')" class="p-2 flex flex-col items-center"><i class="fas fa-wallet"></i><span class="text-[10px]">Earn</span></button>
        <button onclick="switchTab('leader')" class="p-2 flex flex-col items-center"><i class="fas fa-trophy"></i><span class="text-[10px]">Top</span></button>
        <button id="admin-btn" onclick="switchTab('admin')" class="p-2 flex flex-col items-center hidden"><i class="fas fa-user-shield"></i><span class="text-[10px]">Admin</span></button>
    </div>

    <!-- GCash Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-6 hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h2 class="text-xl font-bold mb-2">Setup Profile</h2>
            <p class="text-sm text-gray-500 mb-4">Welcome to the Gold Watch program!</p>
            <input type="text" id="gcash-num" placeholder="GCash Number" class="w-full p-3 border rounded-lg mb-3">
            <input type="text" id="ref-code" placeholder="Referral Code (Optional)" class="w-full p-3 border rounded-lg mb-4">
            <button onclick="saveInitialData()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Start Earning</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
