<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL REWARDS INDIE - Full System</title>
<style>
body {
    background: linear-gradient(120deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    color: #fff;
    text-align: center;
    padding: 20px;
}
h1 { font-size: 2rem; margin-bottom: 10px; }
#balance { font-size: 2rem; margin: 15px 0; }
button {
    font-size: 18px;
    padding: 12px 25px;
    margin: 5px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: #ffec61;
    color: #333;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, background 0.2s ease;
}
button:hover { transform: scale(1.05); background: #ffd700; }
#leaderboard, #withdrawLeaderboard { 
    text-align: left; display: inline-block; margin-top: 20px; color:#333; 
    background:#fff; border-radius:10px; padding:10px; max-width:400px; text-align:left;
}
#leaderboard li, #withdrawLeaderboard li { margin: 5px 0; font-weight: bold; }
#cpm { margin: 10px 0; font-size: 1.2rem; }
.room-buttons { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom:10px; }
.confetti { position: absolute; width: 10px; height: 10px; z-index: 1000; animation: fall 1s linear forwards; }
@keyframes fall { 0% { transform: translateY(0px); opacity:1; } 100% { transform: translateY(400px) rotate(360deg); opacity:0; } }
#usernameInput, #gcashNumber, #withdrawAmount, #adminPass { padding: 10px; border-radius: 10px; border:none; margin-bottom:15px; font-size:16px; }
#adminDashboard { display:none; border:2px solid #fff; padding:10px; margin-top:20px; background:#222; color:#fff; overflow-x:auto; }
#adminTable { width:100%; border-collapse:collapse; margin-top:10px; color:#333; background:#fff; }
#adminTable th, #adminTable td { padding:8px; border-bottom:1px solid #ccc; text-align:center; }
</style>

<script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
</head>
<body>

<h1>🍍 GLOBAL REWARDS INDIE 🍋</h1>

<!-- Username -->
<div>
    <input type="text" id="usernameInput" placeholder="Enter your Telegram username" />
    <button id="setUsername">Set Username</button>
</div>

<div>Balance: <span id="balance">$0.00</span></div>
<div id="cpm">Current CPM: $0.00</div>

<!-- Ad Rooms -->
<div class="room-buttons">
    <button class="adRoom" data-room="1">🍍 Room 1 ($0.05-$0.15)</button>
    <button class="adRoom" data-room="2">🍋 Room 2 ($0.05-$0.15)</button>
    <button class="adRoom" data-room="3">🎉 Room 3 ($0.05-$0.20)</button>
</div>

<!-- Daily Bonus -->
<button id="dailyBonus">🎁 Daily Bonus</button>

<!-- Withdrawal -->
<div>
    <input type="text" id="gcashNumber" placeholder="Enter your GCash Number" />
    <input type="number" id="withdrawAmount" placeholder="Amount to withdraw ($)" step="0.01" />
    <button id="requestWithdrawBtn">💵 Request Withdraw</button>
</div>

<h2>Top Global Users (Balance)</h2>
<ul id="leaderboard"></ul>

<h2>Global Withdrawals (₱)</h2>
<ul id="withdrawLeaderboard"></ul>

<!-- Admin Dashboard -->
<div id="adminDashboard">
    <h2>Admin Withdrawal Dashboard</h2>
    <input type="password" id="adminPass" placeholder="Owner Password" />
    <button id="adminLoginBtn">Login as Owner</button>
    <table id="adminTable">
        <thead>
            <tr>
                <th>Username</th>
                <th>GCash Number</th>
                <th>Amount ($)</th>
                <th>Amount (₱)</th>
                <th>Date/Time</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
    </table>
</div>

<script>
// --- Constants ---
const MIN_WITHDRAW = 0.50, OWNER_PASSWORD = "Propetas6", CONVERSION_RATE = 55;

// --- Storage Setup ---
let username = localStorage.getItem('username') || '';
let balance = parseFloat(localStorage.getItem('balance')) || 0;
let topUsers = JSON.parse(localStorage.getItem('topUsers')) || [];
let withdrawals = JSON.parse(localStorage.getItem('withdrawals')) || [];
let pendingRequests = JSON.parse(localStorage.getItem('pendingRequests')) || [];

if(username) document.getElementById('usernameInput').value = username;

// --- UI Elements ---
const balanceEl=document.getElementById('balance');
const leaderboardEl=document.getElementById('leaderboard');
const withdrawLeaderboardEl=document.getElementById('withdrawLeaderboard');
const pendingEl=document.getElementById('adminTableBody');
const cpmEl=document.getElementById('cpm');

// --- Functions ---
function updateBalanceUI(){ balanceEl.textContent=`$${balance.toFixed(2)}`; }
function updateLeaderboard(){
    leaderboardEl.innerHTML='';
    topUsers.slice().sort((a,b)=>b.balance-a.balance).forEach(u=>{
        const li=document.createElement('li');
        li.textContent=`${u.name} - $${u.balance.toFixed(2)}`;
        leaderboardEl.appendChild(li);
    });
    localStorage.setItem('topUsers',JSON.stringify(topUsers));
}
function updateWithdrawLeaderboard(){
    withdrawLeaderboardEl.innerHTML='';
    withdrawals.slice().sort((a,b)=>b.peso-a.peso).forEach(w=>{
        const li=document.createElement('li');
        li.textContent=`${w.username} - ₱${w.peso}`;
        withdrawLeaderboardEl.appendChild(li);
    });
    localStorage.setItem('withdrawals',JSON.stringify(withdrawals));
}
function showConfetti(){
    for(let i=0;i<20;i++){
        const c=document.createElement('div'); c.className='confetti';
        c.style.left=Math.random()*window.innerWidth+'px';
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),1000);
    }
}
function updateAdminTable(){
    pendingEl.innerHTML='';
    pendingRequests.forEach((req,idx)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`
            <td>${req.username}</td>
            <td>${req.gcash}</td>
            <td>$${req.usd}</td>
            <td>₱${req.peso.toFixed(2)}</td>
            <td>${req.date}</td>
            <td>${req.status || "Pending"}</td>
            <td>
                <button onclick="approveRequest(${idx})" ${req.status==="Approved"?"disabled":""}>Approve</button>
                <button onclick="denyRequest(${idx})" ${req.status==="Denied"?"disabled":""}>Deny</button>
            </td>
        `;
        pendingEl.appendChild(tr);
    });
    localStorage.setItem('pendingRequests',JSON.stringify(pendingRequests));
}

// --- CPM Simulation ---
setInterval(()=>{ cpmEl.textContent=`Current CPM: $${(Math.random()*2+0.5).toFixed(2)}`; },5000);

// --- Set Username ---
document.getElementById('setUsername').addEventListener('click',()=>{
    const input=document.getElementById('usernameInput').value.trim();
    if(input.length<3){ alert("Username too short"); return; }
    username=input;
    localStorage.setItem('username',username);
    if(!topUsers.find(u=>u.name===username)) topUsers.push({name:username,balance:balance});
    updateLeaderboard();
    alert(`Username set: ${username}`);
});

// --- Ad Rooms ---
document.querySelectorAll('.adRoom').forEach(btn=>{
    btn.addEventListener('click',()=>{
        if(!username){ alert("Set username first!"); return; }
        btn.disabled=true;
        const originalText=btn.textContent;
        btn.textContent="Loading Ad...";
        show_10337795().then(()=>{
            const reward=(Math.random()*0.15+0.05).toFixed(2);
            balance+=parseFloat(reward);
            localStorage.setItem('balance',balance);
            const user=topUsers.find(u=>u.name===username); if(user) user.balance=balance;
            updateBalanceUI(); updateLeaderboard(); showConfetti();
            btn.textContent=originalText; btn.disabled=false;
        }).catch(()=>{ btn.textContent=originalText; btn.disabled=false; });
    });
});

// --- Daily Bonus ---
document.getElementById('dailyBonus').addEventListener('click',()=>{
    if(!username){ alert("Set username first!"); return; }
    const today=new Date().toLocaleDateString();
    if(localStorage.getItem('lastDaily')===today){ alert("Already claimed today!"); return; }
    show_10337795('pop').then(()=>{
        const bonus=(Math.random()*0.50+0.50).toFixed(2);
        balance+=parseFloat(bonus);
        localStorage.setItem('balance',balance); const user=topUsers.find(u=>u.name===username); if(user) user.balance=balance;
        updateBalanceUI(); updateLeaderboard(); localStorage.setItem('lastDaily',today);
        alert(`Daily Bonus: $${bonus}`); showConfetti();
    }).catch(()=>{});
});

// --- Withdrawal Request ---
document.getElementById('requestWithdrawBtn').addEventListener('click',()=>{
    if(!username){ alert("Set username first!"); return; }
    const gcashNum = document.getElementById('gcashNumber').value.trim();
    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    if(!gcashNum){ alert("Enter GCash number!"); return; }
    if(!amount || amount<=0 || amount>balance){ alert("Invalid withdraw amount!"); return; }
    const peso = amount * CONVERSION_RATE;
    pendingRequests.push({username, gcash:gcashNum, usd:amount, peso, date:new Date().toLocaleString(), status:"Pending", notified:false});
    localStorage.setItem('pendingRequests',JSON.stringify(pendingRequests));
    alert(`Withdrawal request submitted: $${amount} (₱${peso.toFixed(2)}) to ${gcashNum}`);
    updateAdminTable();
});

// --- Admin Login ---
document.getElementById('adminLoginBtn').addEventListener('click',()=>{
    const pass=document.getElementById('adminPass').value;
    if(pass===OWNER_PASSWORD){
        document.getElementById('adminDashboard').style.display='block';
        updateAdminTable();
        alert("Owner access granted");
    } else { alert("Wrong password"); }
});

// --- Approve / Deny ---
window.approveRequest=function(idx){
    const req=pendingRequests[idx]; req.status="Approved";
    withdrawals.push({username:req.username, gcash:req.gcash, usd:req.usd, peso:req.peso.toFixed(2)});
    const user=topUsers.find(u=>u.name===req.username); if(user) user.balance-=req.usd;
    if(username===req.username) balance=user.balance;
    updateBalanceUI(); updateLeaderboard(); updateWithdrawLeaderboard(); updateAdminTable();
    alert(`✅ Withdrawal of $${req.usd} to ${req.gcash} APPROVED!`);
    localStorage.setItem('withdrawals', JSON.stringify(withdrawals));
    localStorage.setItem('pendingRequests', JSON.stringify(pendingRequests));
}

window.denyRequest=function(idx){
    pendingRequests[idx].status="Denied"; updateAdminTable();
    alert(`❌ Withdrawal of $${pendingRequests[idx].usd} to ${pendingRequests[idx].gcash} DENIED!`);
    localStorage.setItem('pendingRequests', JSON.stringify(pendingRequests));
}

// --- Real-time Notifications ---
function checkWithdrawalNotifications(){
    pendingRequests.forEach(req=>{
        if(req.username===username && req.status && !req.notified){
            req.notified=true;
            if(req.status==="Approved"){
                alert(`✅ Your withdrawal of $${req.usd} to ${req.gcash} has been APPROVED!`);
                const user = topUsers.find(u=>u.name===username);
                if(user) user.balance -= req.usd;
                balance = user.balance;
            } else if(req.status==="Denied"){
                alert(`❌ Your withdrawal of $${req.usd} to ${req.gcash} has been DENIED!`);
            }
            updateAdminTable();
            localStorage.setItem('pendingRequests', JSON.stringify(pendingRequests));
        }
    });
}
setInterval(checkWithdrawalNotifications, 3000);

// --- Auto Reward Popups ---
setInterval(()=>{ 
    if(Math.random()<0.3 && username){
        show_10337795('pop').then(()=>{
            const bonus=(Math.random()*0.30+0.20).toFixed(2);
            balance+=parseFloat(bonus); localStorage.setItem('balance',balance);
            const user=topUsers.find(u=>u.name===username); if(user) user.balance=balance;
            updateBalanceUI(); updateLeaderboard(); showConfetti();
        }).catch(()=>{});
    }
},30000);

// --- Monetag In-App Interstitial ---
show_10337795({type:'inApp', inAppSettings:{frequency:2, capping:0.1, interval:30, timeout:5, everyPage:false}});

// --- Simulated Live Users ---
setInterval(()=>{
    const names=['UserX','StarGazer','PixelKing','NeoWave','Luna','CryptoCat','GlitchMaster','EchoBot'];
    const randName=names[Math.floor(Math.random()*names.length)];
    if(!topUsers.find(u=>u.name===randName)) topUsers.push({name:randName,balance:(Math.random()*20+1).toFixed(2)});
    if(topUsers.length>15) topUsers.shift(); updateLeaderboard();
},15000);

// --- Initialize ---
updateBalanceUI(); updateLeaderboard(); updateWithdrawLeaderboard(); updateAdminTable();
</script>
</body>
</html>
