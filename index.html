<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monetag Immediate Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag SDK (NO async / NO defer) -->
<script src="//libtl.com/sdk.js"
        data-zone="10337795"
        data-sdk="show_10337795"></script>

<style>
body{
  background:#0e1220;
  font-family:Arial, sans-serif;
  display:flex;
  flex-direction:column;
  gap:14px;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.btn{
  width:230px;
  height:65px;
  border:none;
  border-radius:16px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
}
.btn:disabled{background:#444;cursor:not-allowed;}
.blue{background:linear-gradient(135deg,#4facfe,#00f2fe);}
.green{background:linear-gradient(135deg,#43e97b,#38f9d7);}
.orange{background:linear-gradient(135deg,#ff9800,#ff5722);}
.purple{background:linear-gradient(135deg,#a18cd1,#fbc2eb);}
.time{font-size:12px;opacity:.9;margin-top:4px;}
</style>
</head>

<body>

<button id="daily" class="btn blue">
🎁 Daily Login
<div class="time" id="t_daily">Ready</div>
</button>

<button id="gift" class="btn green">
🎁 Gift
<div class="time" id="t_gift">Ready</div>
</button>

<button id="inapp" class="btn orange">
📺 Interstitial
<div class="time" id="t_inapp">Ready</div>
</button>

<button id="popup" class="btn purple">
🎉 Rewarded Popup
<div class="time" id="t_popup">Ready</div>
</button>

<script>
const cooldowns = {
  daily: 900000,
  gift: 900000,
  inapp: 300000,
  popup: 300000
};

function ready(){
  return typeof window.show_10337795 === "function";
}

function update(btn, label, key, ms){
  const last = localStorage.getItem(key);
  if(!last){ btn.disabled=false; label.textContent="Ready"; return; }
  const d = Date.now()-last;
  if(d>=ms){ btn.disabled=false; label.textContent="Ready"; }
  else{
    btn.disabled=true;
    const r=ms-d;
    const m=Math.floor(r/60000);
    const s=Math.floor((r%60000)/1000);
    label.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  }
}

setInterval(()=>{
  update(daily,t_daily,"cd_daily",cooldowns.daily);
  update(gift,t_gift,"cd_gift",cooldowns.gift);
  update(inapp,t_inapp,"cd_inapp",cooldowns.inapp);
  update(popup,t_popup,"cd_popup",cooldowns.popup);
},1000);

// 🔁 BACKUP CHAIN
async function showWithBackup(reward=true){
  try{
    await show_10337795(); // Rewarded interstitial
    if(reward) alert("✅ Reward granted");
    return true;
  }catch(e1){
    try{
      await show_10337795('pop'); // Rewarded popup
      if(reward) alert("🎁 Popup reward");
      return true;
    }catch(e2){
      try{
        show_10337795({
          type:'inApp',
          inAppSettings:{
            frequency:1,
            capping:0.1,
            interval:30,
            timeout:5,
            everyPage:false
          }
        });
        return true;
      }catch(e3){
        alert("❌ No ad available");
        return false;
      }
    }
  }
}

// BUTTON HANDLERS
daily.onclick = async ()=>{
  if(!ready()) return alert("Ad not ready");
  daily.disabled=true; t_daily.textContent="Loading...";
  if(await showWithBackup(true))
    localStorage.setItem("cd_daily",Date.now());
};

gift.onclick = async ()=>{
  if(!ready()) return alert("Ad not ready");
  gift.disabled=true; t_gift.textContent="Loading...";
  if(await showWithBackup(true))
    localStorage.setItem("cd_gift",Date.now());
};

inapp.onclick = async ()=>{
  if(!ready()) return alert("Ad not ready");
  inapp.disabled=true; t_inapp.textContent="Showing...";
  show_10337795({
    type:'inApp',
    inAppSettings:{
      frequency:2,
      capping:0.1,
      interval:30,
      timeout:5,
      everyPage:false
    }
  });
  localStorage.setItem("cd_inapp",Date.now());
};

popup.onclick = async ()=>{
  if(!ready()) return alert("Ad not ready");
  popup.disabled=true; t_popup.textContent="Loading...";
  try{
    await show_10337795('pop');
    alert("🎉 Popup reward");
    localStorage.setItem("cd_popup",Date.now());
  }catch(e){
    show_10337795({
      type:'inApp',
      inAppSettings:{frequency:1,capping:0.1,interval:30,timeout:5,everyPage:false}
    });
    localStorage.setItem("cd_popup",Date.now());
  }
};
</script>

</body>
</html>
