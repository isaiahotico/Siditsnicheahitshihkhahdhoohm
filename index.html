<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold Armor - Interstitial Edition</title>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold-bright: #fff9d0;
            --gold-metallic: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --armor-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            background: #0f0c08;
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .gold-armor-container {
            width: 100%;
            max-width: 400px;
            padding: 25px;
            background: radial-gradient(circle at top, #2c2102 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .armor-plate {
            width: 100%;
            background: var(--gold-metallic);
            border-radius: 20px;
            padding: 2px; /* Border effect */
            box-shadow: var(--armor-shadow);
            margin-bottom: 30px;
        }

        .armor-inner {
            background: rgba(20, 20, 20, 0.9);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            background: var(--gold-metallic);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
        }

        .balance-display {
            font-size: 48px;
            font-weight: 800;
            color: var(--gold-bright);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin: 10px 0;
        }

        .ad-btn {
            width: 100%;
            height: 60px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            background: var(--gold-metallic);
            color: #3e2b00;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;

            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .ad-btn:active { transform: scale(0.97); }

        /* Shining Animation Overlay */
        .ad-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transition: 0.5s;
            animation: armorShine 3s infinite;
        }

        @keyframes armorShine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        #status-bar {
            margin-top: 20px;
            font-size: 13px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid #d4af37;
        }
    </style>
</head>
<body>

<div class="gold-armor-container">
    <div class="armor-plate">
        <div class="armor-inner">
            <h1>Gold Armor</h1>
            <div style="font-size: 11px; color: #888;">TREASURE BALANCE</div>
            <div class="balance-display" id="balance">0</div>
        </div>
    </div>

    <!-- 3 Interstitial Ad Buttons -->
    <button class="ad-btn" onclick="triggerInterstitial('btn1')">🛡️ Summon Armor Ad</button>
    <button class="ad-btn" onclick="triggerInterstitial('btn2')">⚔️ Gold Interstitial</button>
    <button class="ad-btn" onclick="triggerInterstitial('btn3')">👑 Royal Shield Ad</button>

    <div id="status-bar">Waiting for warrior...</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
