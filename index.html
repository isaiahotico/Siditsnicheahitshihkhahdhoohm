<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TKGAH - Watch Ads & Earn GCash</title>
<style>
    /* --- Base Styles --- */
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg,#667eea,#764ba2);
        color: #fff;
        text-align: center;
        padding: 20px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 5px; }
    h2 { font-weight: 400; margin-bottom: 20px; }

    /* --- Balance Card --- */
    .balance-card {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 30px;
        max-width: 400px;
        margin-left:auto;
        margin-right:auto;
    }
    .balance-card span {
        font-size: 2rem;
        font-weight: bold;
        color: #ffd700;
    }

    /* --- Ads Container (optional for future ad cards) --- */
    .ads-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-bottom: 20px;
    }
    .ad-card {
        background: rgba(255,255,255,0.1);
        padding: 15px;
        border-radius: 15px;
        width: 250px;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .ad-card:hover { transform: translateY(-5px); }
    .ad-card button {
        background: #ffd700;
        color: #764ba2;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    /* --- Withdraw Button --- */
    .withdraw-btn {
        background: #00ff90;
        color: #333;
        padding: 12px 25px;
        border-radius: 15px;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        cursor: pointer;
        margin-top: 20px;
        transition: background 0.2s;
    }
    .withdraw-btn:hover { background: #00e07f; }
</style>
</head>
<body>

<h1>TKGAH</h1>
<h2>Watch Ads & Earn GCash Peso!</h2>

<div class="balance-card">
    <p>Your Balance:</p>
    <span id="balance">₱0.00</span>
</div>

<div class="ads-container">
    <!-- Optional ad cards if you want manual ads -->
</div>

<button class="withdraw-btn" onclick="autoWithdraw()">Auto Withdraw to GCash</button>

<footer style="margin-top:40px; color:rgba(255,255,255,0.7);">
    TKGAH &copy; 2025 | Earn easily via GCash
</footer>

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>

<script>
/* --- Variables --- */
let balance = 0;

/* --- Reward Function --- */
function rewardUser(amount) {
    balance += amount;
    document.getElementById('balance').innerText = `₱${balance.toFixed(2)}`;
    console.log(`User earned ₱${amount}`);
}

/* --- Auto Withdraw Simulation --- */
function autoWithdraw() {
    if(balance <= 0) {
        alert("You don't have enough balance to withdraw!");
        return;
    }
    // Replace this with real GCash integration API
    alert(`Success! ₱${balance.toFixed(2)} withdrawn to your GCash.`);
    balance = 0;
    document.getElementById('balance').innerText = `₱0.00`;
}

/* --- Automatic Rewarded Ads --- */

// Rewarded interstitial ad
function showInterstitialAd() {
    show_10337795({
        type: 'inApp',
        inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
        }
    }).then(() => {
        rewardUser(10); // reward ₱10 per interstitial ad
    }).catch(e => console.log('Interstitial ad error:', e));
}

// Rewarded popup ad
function showPopupAd() {
    show_10337795('pop').then(() => {
        rewardUser(5); // reward ₱5 per popup ad
    }).catch(e => console.log('Popup ad error:', e));
}

// Initialize automatic ads
setInterval(showInterstitialAd, 2 * 60 * 1000); // every 2 minutes
setInterval(showPopupAd, 3 * 60 * 1000);         // every 3 minutes

// Show first ads immediately
showInterstitialAd();
showPopupAd();

</script>

</body>
</html>
