<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL REWARDS INDIE - Real-Time Username</title>
<style>
body {
    background: linear-gradient(120deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    color: #fff;
    text-align: center;
    padding: 20px;
}
h1 { font-size: 2rem; margin-bottom: 10px; }
#balance { font-size: 2rem; margin: 15px 0; }
button {
    font-size: 18px;
    padding: 12px 25px;
    margin: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: #ffec61;
    color: #333;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, background 0.2s ease;
}
button:hover { transform: scale(1.1); background: #ffd700; }
#leaderboard { text-align: left; display: inline-block; margin-top: 20px; }
#leaderboard li { margin: 5px 0; font-weight: bold; }
#cpm { margin: 10px 0; font-size: 1.2rem; }
.room-buttons { display: flex; justify-content: center; flex-wrap: wrap; }
.confetti { position: absolute; width: 10px; height: 10px; z-index: 1000; animation: fall 1s linear forwards; }
@keyframes fall { 0% { transform: translateY(0px); opacity:1; } 100% { transform: translateY(400px) rotate(360deg); opacity:0; } }
#usernameInput { padding: 10px; border-radius: 10px; border:none; margin-bottom:15px; font-size:16px; }
</style>

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
</head>
<body>

<h1>🍍 GLOBAL REWARDS INDIE 🍋</h1>

<!-- Username input -->
<div>
    <input type="text" id="usernameInput" placeholder="Enter your Telegram username" />
    <button id="setUsername">Set Username</button>
</div>

<div>Balance: <span id="balance">$0.00</span></div>
<div id="cpm">Current CPM: $0.00</div>

<div class="room-buttons">
    <button class="adRoom" data-room="1">🍍 Room 1 (Reward $0.05-$0.15)</button>
    <button class="adRoom" data-room="2">🍋 Room 2 (Reward $0.05-$0.15)</button>
    <button class="adRoom" data-room="3">🎉 Room 3 (Reward $0.05-$0.20)</button>
</div>

<button id="dailyBonus">🎁 Daily Bonus</button>

<h2>Top Global Users</h2>
<ul id="leaderboard"></ul>

<script>
// --- User Setup ---
let username = localStorage.getItem('username') || '';
if(username) document.getElementById('usernameInput').value = username;

// --- Local Storage Balance ---
let balance = parseFloat(localStorage.getItem('balance')) || 0;
const balanceEl = document.getElementById('balance');
function updateBalanceUI(){ balanceEl.textContent=`$${balance.toFixed(2)}`; }
updateBalanceUI();

// --- CPM Simulation ---
const cpmEl=document.getElementById('cpm');
function updateCPM(){ cpmEl.textContent=`Current CPM: $${(Math.random()*2+0.5).toFixed(2)}`; }
setInterval(updateCPM,5000); updateCPM();

// --- Leaderboard ---
let topUsers=[{name:"Alice",balance:12.34},{name:"Bob",balance:10.50},{name:"Carol",balance:8.75},{name:"Dave",balance:6.20},{name:"Eve",balance:5.00}];
const leaderboardEl=document.getElementById('leaderboard');
function updateLeaderboard(){
    leaderboardEl.innerHTML='';
    topUsers.slice().sort((a,b)=>b.balance-a.balance).forEach(u=>{
        const li=document.createElement('li');
        li.textContent=`${u.name} - $${u.balance.toFixed(2)}`;
        leaderboardEl.appendChild(li);
    });
}
setInterval(()=>{
    topUsers.forEach(u=>u.balance+=(Math.random()*0.2).toFixed(2)*1);
    updateLeaderboard();
},5000);
updateLeaderboard();

// --- Confetti ---
function showConfetti(){
    for(let i=0;i<20;i++){
        const c=document.createElement('div'); c.className='confetti';
        c.style.left=Math.random()*window.innerWidth+'px';
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),1000);
    }
}

// --- Set Username Button ---
document.getElementById('setUsername').addEventListener('click',()=>{
    const input=document.getElementById('usernameInput').value.trim();
    if(input.length<3){ alert("Username too short"); return; }
    username=input;
    localStorage.setItem('username',username);
    alert(`Username set: ${username}`);
    // Add user to leaderboard if not exists
    if(!topUsers.find(u=>u.name===username)) topUsers.push({name:username,balance:balance});
    updateLeaderboard();
});

// --- Ad Room Logic (Rewarded Interstitial) ---
document.querySelectorAll('.adRoom').forEach(btn=>{
    btn.addEventListener('click',()=>{
        if(!username){ alert("Set your username first!"); return; }
        btn.disabled=true;
        const originalText=btn.textContent;
        btn.textContent="Loading Ad...";
        show_10337795().then(()=>{
            const reward=(Math.random()*0.15+0.05).toFixed(2);
            balance+=parseFloat(reward);
            localStorage.setItem('balance',balance);
            // Update leaderboard for this user
            const user=topUsers.find(u=>u.name===username);
            if(user) user.balance=balance;
            updateBalanceUI();
            updateLeaderboard();
            showConfetti();
            btn.textContent=originalText;
            btn.disabled=false;
        }).catch(()=>{ alert('Ad failed to load'); btn.textContent=originalText; btn.disabled=false; });
    });
});

// --- Daily Bonus (Rewarded Popup) ---
document.getElementById('dailyBonus').addEventListener('click',()=>{
    if(!username){ alert("Set your username first!"); return; }
    const today=new Date().toLocaleDateString();
    const lastClaim=localStorage.getItem('lastDaily')||'';
    if(lastClaim===today){ alert("🎁 Already claimed today!"); return; }
    show_10337795('pop').then(()=>{
        const bonus=(Math.random()*0.50+0.50).toFixed(2);
        balance+=parseFloat(bonus);
        localStorage.setItem('balance',balance);
        localStorage.setItem('lastDaily',today);
        const user=topUsers.find(u=>u.name===username);
        if(user) user.balance=balance;
        updateBalanceUI();
        updateLeaderboard();
        alert(`🎉 Daily Bonus: $${bonus} added!`);
        showConfetti();
    }).catch(()=>{ alert("Ad failed or closed. Bonus not granted."); });
});

// --- Auto Reward Popups ---
setInterval(()=>{
    if(Math.random()<0.3 && username){ // 30% chance every 30s
        show_10337795('pop').then(()=>{
            const bonus=(Math.random()*0.30+0.20).toFixed(2);
            balance+=parseFloat(bonus);
            localStorage.setItem('balance',balance);
            const user=topUsers.find(u=>u.name===username);
            if(user) user.balance=balance;
            updateBalanceUI();
            updateLeaderboard();
            showConfetti();
        }).catch(()=>{});
    }
},30000);

// --- Monetag In-App Interstitial ---
show_10337795({
    type:'inApp',
    inAppSettings:{
        frequency:2,
        capping:0.1,
        interval:30,
        timeout:5,
        everyPage:false
    }
});

// --- Simulated Live Users Joining ---
setInterval(()=>{
    const names=['UserX','StarGazer','PixelKing','NeoWave','Luna','CryptoCat','GlitchMaster','EchoBot'];
    const randName=names[Math.floor(Math.random()*names.length)];
    if(!topUsers.find(u=>u.name===randName)) topUsers.push({name:randName,balance:(Math.random()*20+1).toFixed(2)});
    if(topUsers.length>15) topUsers.shift();
    updateLeaderboard();
},15000);

</script>
</body>
</html>
