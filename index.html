<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchPoint Pro | YT Booster</title>
    <!-- Telegram & YouTube SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>

    <style>
        :root { --bg: #0a0a0a; --card: #161616; --accent: #ff0000; --tg-blue: #0088cc; --gold: #f1c40f; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; padding-bottom: 100px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--card); border-radius: 15px; margin-bottom: 15px; border-bottom: 2px solid var(--tg-blue); }
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .balance-card { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #222; }
        
        /* YouTube Sliding Container */
        #player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #player { width: 100%; height: 100%; }

        .progress-container { height: 6px; background: #222; margin: 15px 0; border-radius: 10px; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; transition: width 1s linear; }

        button { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin: 5px 0; transition: 0.3s; }
        .btn-play { background: #27ae60; color: white; font-size: 1.2em; }
        .btn-next { background: var(--tg-blue); color: white; }
        
        .section-title { font-size: 14px; text-transform: uppercase; color: #777; margin: 20px 0 10px 5px; font-weight: bold; display: flex; justify-content: space-between; }

        .video-item { background: var(--card); padding: 10px; border-radius: 10px; display: flex; align-items: center; margin-bottom: 8px; border: 1px solid #222; }
        .video-item img { width: 80px; border-radius: 5px; margin-right: 12px; }
        .watch-tag { margin-left: auto; color: var(--gold); font-size: 12px; font-weight: bold; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; text-align: center; }
        input { padding: 12px; width: 90%; border-radius: 10px; border: 1px solid #333; background: #000; color: white; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Mandatory GCash Prompt -->
    <div id="gcash-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--tg-blue)">Setup Payouts</h2>
            <p>Enter your GCash number to receive your earnings.</p>
            <input type="number" id="gcash-input" placeholder="09xxxxxxxxx">
            <button class="btn-play" onclick="saveGcash()">Save & Start Earning</button>
        </div>
    </div>

    <div class="top-nav">
        <span style="font-weight: bold;">@<span id="user-display">Guest</span></span>
        <span id="slot-count" style="font-size: 12px;">Slots: 0/5</span>
    </div>

    <div class="balance-grid">
        <div class="balance-card"><small>Points</small><br><b id="pts-val" style="font-size: 20px;">0</b></div>
        <div class="balance-card"><small>PHP Balance</small><br><b id="php-val" style="font-size: 20px; color:var(--gold);">₱0.00</b></div>
    </div>

    <div id="player-wrapper"><div id="player"></div></div>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div id="timer-label" style="text-align:center; font-size: 13px; color:#aaa">Ready to watch</div>

    <button class="btn-play" id="play-trigger" onclick="pressPlay()">▶ START WATCHING</button>
    <button class="btn-next" onclick="forceNext()">⏭ SKIP VIDEO (RANDOM AD)</button>

    <div class="section-title"><span>My Video List</span> <span style="color:var(--tg-blue)" onclick="document.getElementById('add-video-modal').style.display='flex'">+ Add New</span></div>
    <div id="profile-video-list">
        <!-- User videos list with watch counts -->
    </div>

    <div class="section-title">Withdrawals</div>
    <div id="withdrawal-history" style="font-size: 13px;"></div>
    <button onclick="submitWithdraw()" style="background: #e67e22; color:white;">Withdraw to GCash (Min 2,000 Pts)</button>

    <!-- Hidden Admin Panel Trigger -->
    <div style="margin-top:50px; text-align: center; opacity: 0.2;">
        <span onclick="openAdmin()">Owner Dashboard</span>
    </div>

    <div id="admin-panel" class="modal">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
            <h3>Pending Approvals</h3>
            <div id="admin-list"></div>
            <button onclick="document.getElementById('admin-panel').style.display='none'">Close</button>
        </div>
    </div>

    <div id="add-video-modal" class="modal">
        <div class="modal-content">
            <h3>Add YouTube Video</h3>
            <input type="text" id="new-yt-url" placeholder="Paste YouTube Link">
            <button class="btn-play" onclick="addNewVideo()">Confirm Add</button>
            <button onclick="document.getElementById('add-video-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
