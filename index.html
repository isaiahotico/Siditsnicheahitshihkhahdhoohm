<body class="bg-gradient-to-r from-blue-400 to-green-400 min-h-screen flex flex-col items-center justify-start p-4 font-sans">

      </div>

      <div class="flex justify-between">
        <button id="playVideo" class="bg-green-500 text-white rounded-lg py-2 px-4 hover:bg-green-600">Play</button>
        <button id="nextVideo" class="bg-yellow-500 text-white rounded-lg py-2 px-4 hover:bg-yellow-600">Next</button>
      </div>
    </div>
  </div>
